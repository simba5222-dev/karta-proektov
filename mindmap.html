<html lang="ru"><head>

<title>Карта компании — Техно-Ресурс</title>
<style>
:root{
  --bg:#eaeeef; --surface:#fff; --surface-2:#f4f7f8; --sunken:#e3e9ea;
  --ink:#14202a; --ink-2:#485965; --ink-3:#7b8d99;
  --line:#ccd6d9; --line-2:#b4c1c6;
  --accent:#0b5e6e; --accent-soft:#dcedf0;
  --ok:#3d6a41; --ok-soft:#e4efe3;
  --warn:#8f4d0e; --warn-soft:#faecd9;
  --stop:#8f2e2d; --stop-soft:#f8e3e1;
  --wait:#4c5a97; --wait-soft:#e2e6f5;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101820; --surface:#18232b; --surface-2:#141d24; --sunken:#0d151b;
  --ink:#e6eef1; --ink-2:#a8b9c3; --ink-3:#788a95;
  --line:#293640; --line-2:#3a4b55;
  --accent:#5ab6c6; --accent-soft:#112f37;
  --ok:#8bc28e; --ok-soft:#1a2a1d;
  --warn:#dfa35b; --warn-soft:#31240f;
  --stop:#e78a80; --stop-soft:#361d1b;
  --wait:#98a6e0; --wait-soft:#1b2036;
}}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);overflow:hidden;
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.top{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--surface);
  border-bottom:1px solid var(--line);padding:9px 14px}
.top h1{margin:0;font-size:17px;display:inline-block}
.top .sub{font-size:12px;color:var(--ink-3);margin-left:10px}
.tools{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:8px}
input[type=search]{flex:0 1 240px;padding:6px 9px;font:inherit;font-size:13px;
  border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2);color:var(--ink)}
button{padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);
  border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2)}
button:hover{background:var(--sunken)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:7px;font-size:12px;color:var(--ink-2)}
.lg{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px}
.lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.lg b{font-variant-numeric:tabular-nums;color:var(--ink-3)}
.lg.off{opacity:.3}
.lg.ok i{background:var(--ok)} .lg.accent i{background:var(--accent)}
.lg.warn i{background:var(--warn)} .lg.stop i{background:var(--stop)}
.lg.wait i{background:var(--wait)}
#map{position:absolute;inset:0;top:0;width:100vw;height:100vh;cursor:grab}
#map.grabbing{cursor:grabbing}
#map.linking{cursor:crosshair}
.node rect{stroke-width:1.5}
.node text{font:13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  fill:var(--ink);pointer-events:none}
.node .cnt{font-size:11px;fill:var(--ink-3)}
.node.dim{opacity:.22}
.node.picked rect{stroke-dasharray:4 3}
.link{fill:none;stroke:var(--line-2);stroke-width:1.6}
.rel{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:6 4;marker-end:url(#arrow)}
.rel-label{font-size:11px;fill:var(--accent)}
.panel{position:absolute;left:14px;bottom:14px;max-width:420px;background:var(--surface);
  border:1px solid var(--line);border-radius:3px;padding:11px 13px;font-size:13px;
  box-shadow:0 4px 18px rgba(0,0,0,.12);display:none}
.panel b{display:block;margin-bottom:4px}
.panel .k{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.panel p{margin:5px 0 0;color:var(--ink-2)}
.hint{position:absolute;right:14px;bottom:14px;font-size:12px;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:7px 10px}
</style></head><body>

<div class="top">

</div>

<svg id="map"><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"

<g id="canvas"><g id="links"></g><g id="rels"></g><g id="nodes"></g></g></svg>

<div class="panel" id="panel"></div>

<script>
const TREE = {"t": "Техно-Ресурс", "k": "план", "n": "Все направления, задачи и решения", "c": [{"t": "Что держит работу", "k": "риск", "n": "Только ваши действия", "c": [{"t": "Сменить дефолтный пароль главного механика", "k": "риск", "n": "сайт механиков · вход по открытому http", "id": "0.0.0"}, {"t": "Сертификат для meh.techno-res.ru", "k": "риск", "n": "Let's Encrypt на хостинге Timeweb", "id": "0.0.1"}], "id": "0.0"}, {"t": "Отдел механизации", "k": "сделано", "n": "Служба механиков", "c": [{"t": "Алгоритм: путь задачи", "k": "план", "c": [{"t": "Главный механик создаёт задачу на объект", "k": "сделано", "n": "Назначает ответственного механика — tasks.assignee_id. Задача рождается в статусе с флагом is_initial.", "id": "0.1.0.0"}, {"t": "Механик распределяет работу — две возможности", "k": "сделано", "id": "0.1.0.1"}, {"t": "Слесарь выполняет, но в систему не заходит", "k": "сделано", "n": "У роли fitter стоит can_login = 0, логина и пароля нет вовсе. Это решение, а не недоделка: слесари не пользуются компьютером. Отметки за них ставит механик.", "id": "0.1.0.2"}, {"t": "Смена статуса — только через одну точку", "k": "сделано", "n": "Функция change_task_status(). Статусы не зашиты в код: это строки в справочнике task_statuses, а tasks.status хранит их code. Права проверяются флагами allow_admin / allow_mechanic / allow_fitter.", "id": "0.1.0.3"}, {"t": "Побочные действия статуса", "k": "сделано", "id": "0.1.0.4"}, {"t": "Видно в диспетчерской, табеле и отчётах", "k": "сделано", "n": "Сводка для главного механика, табель за период, отчёты по механикам, задачам и технике с выгрузкой в CSV.", "id": "0.1.0.5"}], "id": "0.1.0"}, {"t": "Сделано", "k": "сделано", "c": [{"t": "Доска задач с карточками, история изменений, фотоотчёты", "k": "сделано", "id": "0.1.1.0"}, {"t": "Реестр техники, справочник объектов, табель, отчёты с выгрузкой", "k": "сделано", "id": "0.1.1.1"}, {"t": "Четыре роли с разными правами; мягкое удаление вместо стирания истории", "k": "сделано", "id": "0.1.1.2"}, {"t": "Под git с 15.09.2026: два коммита, реквизиты БД исключены, рядом шаблон конфига", "k": "сделано", "id": "0.1.1.3"}], "id": "0.1.1"}, {"t": "Осталось", "k": "вопрос", "c": [{"t": "Сменить пароль главного механика", "k": "вопрос", "n": "до сих пор стоит значение по умолчанию; значение здесь не печатаю — страница отдаётся по http", "id": "0.1.2.0"}, {"t": "Выпустить сертификат для meh.techno-res.ru", "k": "вопрос", "n": "разблокирует вебхуки бота и закроет пароли в канале", "id": "0.1.2.1"}, {"t": "Приватный репозиторий на GitHub и свой деплой-ключ", "k": "вопрос", "n": "история пока только на этом сервере", "id": "0.1.2.2"}, {"t": "Интерфейс подзадач", "k": "вопрос", "n": "поле tasks.parent_id есть, экрана нет", "id": "0.1.2.3"}, {"t": "Табель слесарей: отметка присутствия механиком", "k": "вопрос", "id": "0.1.2.4"}, {"t": "Удалить тестовые записи", "k": "вопрос", "n": "«Тестовый слесарь (удалить)», объект «Торики»", "id": "0.1.2.5"}, {"t": "Свести board.css обратно в style.css", "k": "вопрос", "n": "разделены только из-за дорогой заливки через панель хостинга", "id": "0.1.2.6"}], "id": "0.1.2"}], "id": "0.1"}, {"t": "Отдел продаж", "k": "сделано", "n": "Разбор входящих лидов", "c": [{"t": "Алгоритм: путь звонка с рекламы", "k": "план", "c": [{"t": "Клиент звонит на общий номер компании", "k": "сделано", "n": "Номера подключены к ВАТС МегаФон. По такому звонку Synergy автоматически заводит заявку — это и есть входящий поток лидов.", "id": "0.2.0.0"}, {"t": "ВАТС присылает вебхук, сверяем ключ", "k": "сделано", "n": "Около 3300 событий в сутки. Принимаем history, event, contact и rating; отвечать успехом обязательно на все, иначе ВАТС сочтёт интеграцию сломанной.", "id": "0.2.0.1"}, {"t": "Отбираем звонки «с рекламы»", "k": "сделано", "n": "Поле custom-10886 в звонке Synergy. Из 650 звонков в день такую метку имеют около 22 — остальные отсеиваются до скачивания, чтобы не тратить процессор впустую.", "id": "0.2.0.2"}, {"t": "Скачиваем запись и распознаём", "k": "сделано", "n": "Оператор и клиент в разных каналах — роли делятся по дорожкам. Распознавание локальное, модель medium: она точнее на телефонном звуке. Записи длиннее 8 минут идут small — иначе одна длинная занимает сервер на полчаса, а он двухъядерный.", "id": "0.2.0.3"}, {"t": "Отдаём расшифровку на разбор в Амстердам", "k": "сделано", "n": "OpenAI не обслуживает российские адреса, поэтому разбор уехал туда, где модель доступна. Ручка /analyze, общий секрет в заголовке, 2–3 секунды на разговор.", "id": "0.2.0.4"}, {"t": "Заполняем заявку", "k": "сделано", "id": "0.2.0.5"}, {"t": "Ставим задачу", "k": "риск", "n": "Единственный пункт из требований, которого нет совсем. В Synergy это сущность diaries со связями на контакт, заказ и ответственного.", "id": "0.2.0.6"}], "id": "0.2.0"}, {"t": "Сделано", "k": "сделано", "c": [{"t": "Работает в бою с 14.09: 631 запись, 424 расшифровки, вебхуки идут непрерывно", "k": "сделано", "id": "0.2.1.0"}, {"t": "Записи стерео, роли делятся верно — вопрос, висевший с начала проекта, закрыт", "k": "сделано", "id": "0.2.1.1"}, {"t": "Разбор через OpenAI перенесён в Амстердам: было 30 с таймаута, стало 2–3 с", "k": "сделано", "id": "0.2.1.2"}, {"t": "Заполняются поля заявки, пишутся отчёты РОПу и менеджеру, ставятся комментарии", "k": "сделано", "id": "0.2.1.3"}, {"t": "Клиент ВАТС приведён к актуальному API /crmapi/v1, 109 тестов проходят", "k": "сделано", "id": "0.2.1.4"}, {"t": "Код боевого сервера под git: есть слепок и возможность отката", "k": "сделано", "id": "0.2.1.5"}, {"t": "Догонялка: записи без расшифровки возвращаются таймером каждые 15 минут", "k": "сделано", "id": "0.2.1.6"}, {"t": "Щадящий режим к Synergy: общий тормоз частоты и повторы у всех запросов", "k": "сделано", "id": "0.2.1.7"}], "id": "0.2.1"}, {"t": "Осталось", "k": "вопрос", "c": [{"t": "Постановка задач в Synergy", "k": "вопрос", "n": "последний невыполненный пункт требований; сущность diaries", "id": "0.2.2.0"}, {"t": "Решить, устраивает ли качество распознавания", "k": "вопрос", "n": "small путает названия техники: «шантуем» вместо Shantui, «не с лестерем» вместо «не слесарем»", "id": "0.2.2.1"}, {"t": "Решить, обрабатывать ли звонки тёплого прозвона", "k": "вопрос", "n": "сейчас фильтр «с рекламы» отсекает их полностью", "id": "0.2.2.2"}, {"t": "Довыкатить переписанный клиент ВАТС", "k": "вопрос", "n": "на боевом сервере пока три файла из изменённых; остальное ждёт", "id": "0.2.2.3"}, {"t": "Убрать мусор в корне /opt/asr", "k": "вопрос", "n": "копии модулей от неудачной выкладки, на них нет ссылок", "id": "0.2.2.4"}], "id": "0.2.2"}], "id": "0.2"}, {"t": "Бот MAX", "k": "вопрос", "n": "Отметки из мессенджера", "c": [{"t": "Алгоритм: как задуман", "k": "план", "c": [{"t": "Слесарь пишет отметку в общую группу", "k": "план", "n": "Смысл всей затеи: слесарь не заходит на сайт и не будет, а мессенджер у него уже открыт.", "id": "0.3.0.0"}, {"t": "Как сообщение доходит до нас — развилка", "k": "риск", "id": "0.3.0.1"}, {"t": "Опознать, кто написал", "k": "план", "n": "Участник группы сопоставляется с сотрудником через users.max_user_id. Поле в базе уже зарезервировано — заполнить его для слесарей предстоит руками.", "id": "0.3.0.2"}, {"t": "Записать отметку в базу механизации", "k": "план", "n": "Строка в daily_reports с source = 'max_bot'. Значение в схеме тоже заранее предусмотрено — бот встаёт на подготовленное место, рядом с self и mechanic.", "id": "0.3.0.3"}, {"t": "Механик видит отметку в табеле", "k": "план", "n": "Дальше ничего нового не нужно: табель и отчёты уже умеют показывать отметки, им неважно, кто их поставил.", "id": "0.3.0.4"}], "id": "0.3.0"}, {"t": "Уже понятно", "k": "сделано", "c": [{"t": "Зачем нужен: слесари не логинятся принципиально", "k": "сделано", "id": "0.3.1.0"}, {"t": "Точки стыковки в базе зарезервированы заранее", "k": "сделано", "id": "0.3.1.1"}, {"t": "Развилка по доставке известна, оба пути описаны", "k": "сделано", "id": "0.3.1.2"}], "id": "0.3.1"}, {"t": "Осталось", "k": "вопрос", "c": [{"t": "Определить границы проекта", "k": "вопрос", "n": "только механизация или ещё отдел продаж — от этого зависит, где боту жить", "id": "0.3.2.0"}, {"t": "Выбрать путь доставки", "k": "вопрос", "n": "дождаться HTTPS либо сознательно взять опрос по крону", "id": "0.3.2.1"}, {"t": "Разобраться с API мессенджера MAX", "k": "вопрос", "n": "вебхуки, лимиты, опознание участников группы", "id": "0.3.2.2"}, {"t": "Заполнить users.max_user_id для слесарей", "k": "вопрос", "id": "0.3.2.3"}, {"t": "Создать репозиторий и каркас", "k": "вопрос", "id": "0.3.2.4"}], "id": "0.3.2"}], "id": "0.3"}, {"t": "Дашборд прозвона", "k": "сделано", "n": "Контроль тёплого прозвона", "c": [{"t": "Алгоритм: как считается день менеджера", "k": "план", "c": [{"t": "Забираем звонки из Synergy", "k": "сделано", "n": "Сущность telephony-calls: направление, длительность, время, ссылка на запись. Кто звонил — в самом звонке, поле custom-28722 вида «Фамилия Имя Отчество 726». ВАТС для этого не нужна.", "id": "0.4.0.0"}, {"t": "Считаем количество и отделяем дозвоны", "k": "сделано", "id": "0.4.0.1"}, {"t": "Находим клиента в Synergy по номеру", "k": "сделано", "n": "Телефон — единственный надёжный ключ между системами. Код поиска контакта уже написан в сервисе ASR, переиспользуем.", "id": "0.4.0.2"}, {"t": "Проверяем, что менеджер заполнил карточку", "k": "сделано", "n": "Четыре пункта: потребность в технике, объекты, ИНН компании, поставленная задача. Заполнением считается правка в течение 30 минут после звонка. Частота заказов считается отдельно — по числу заявок и сделок клиента.", "id": "0.4.0.3"}, {"t": "Разбираем сам разговор", "k": "сделано", "n": "Запись тянет российский сервер — МегаФон не отдаёт записи зарубежным адресам. Распознаёт местный faster-whisper, деля стерео на менеджера и клиента. Расшифровка вместе с карточкой уходит в модель, та возвращает: о чём говорили, что прозвучало и не попало в CRM, каких обязательных вопросов по учебнику менеджер не задал и что не предложил в дополнение.", "id": "0.4.0.4"}, {"t": "Показываем на дашборде", "k": "сделано", "n": "Готово: экраны «сегодня», «менеджер» и «звонок» на http://72.56.25.105/dashboard/, доступ по паролю. Пока показывают показательные данные — источники не подключены.", "id": "0.4.0.5"}, {"t": "Разворачиваем итог: что вышло из разговора", "k": "сделано", "n": "Отдельная таблица /report, строка на каждый разговор: кому звонил, что добавил в карточку, какая потребность у клиента дословно, заведена ли компания, сколько заявок создал, кого назначили ответственным и чем заявки кончились. Заявка считается заведённой по звонку, если создана в течение 24 часов после него.", "id": "0.4.0.6"}, {"t": "Проваливаемся в заявку: почему не дошла до сделки", "k": "сделано", "n": "Заявку заводит прозвон, а ведёт её другой человек. Его звонки собираются отдельно — по телефонам клиента за период от создания заявки, — распознаются и разбираются. Вердикт: что произошло, позиция клиента, что ответственный сделал и чего не сделал, можно ли вернуть. Если история не пролистана до даты заявки, вердикт не выносится: «мы не смотрели» и «менеджер не звонил» — разные вещи.", "id": "0.4.0.7"}, {"t": "Ловим заявки, о которых менеджер не сказал", "k": "сделано", "n": "Все входящие отдела продаж: по контакту проверяется, появилась ли заявка после звонка. Если нет — распознаётся первая минута записи, и модель отвечает, был ли запрос на технику. Стороны в расшифровке обезличены: кто из них наш менеджер, разбор решает по содержанию — по номеру канала это определить нельзя. Заявка бывает только если технику просит позвонивший. По подтверждённым находкам заводится заявка «Пойманная с прослушки» с выжимкой, расшифровкой и цитатой из записи. Менеджеру даётся три часа, чтобы оформить заявку самому.", "id": "0.4.0.8"}], "id": "0.4.0"}, {"t": "Уже решено", "k": "сделано", "c": [{"t": "Работает на настоящих данных: 951 звонок за 10 дней, обновляется сам каждые 10 минут", "k": "сделано", "id": "0.4.1.0"}, {"t": "Звонки берутся из Synergy, ВАТС не нужна: автор звонка записан в самом звонке", "k": "сделано", "id": "0.4.1.1"}, {"t": "Проверка карточек: потребность, объекты, ИНН, поставленная задача", "k": "сделано", "id": "0.4.1.2"}, {"t": "Задачи видны названием и сроком, а не галочкой: 45 разговоров с задачей за две недели", "k": "сделано", "id": "0.4.1.3"}, {"t": "Частота заказов считается по заявкам и сделкам клиента, а не со слов менеджера", "k": "сделано", "id": "0.4.1.4"}, {"t": "Развёрнутый отчёт /report: фильтр в шапке каждой колонки, период «с — по», причина проигрыша заявки прямо в строке", "k": "сделано", "id": "0.4.1.5"}, {"t": "Разбор разговоров: что упущено в CRM — с цитатой из записи, каких вопросов по учебнику не задали", "k": "сделано", "id": "0.4.1.6"}, {"t": "Заявки /orders: исход, ответственный и вердикт «почему не дошла до сделки»", "k": "сделано", "id": "0.4.1.7"}, {"t": "Доступ по паролю, ссылки работают под приставкой /dashboard/", "k": "сделано", "id": "0.4.1.8"}, {"t": "Пойманные заявки: 16.09 из 107 входящих отдела продаж 95 без заявки, найдено 24 запроса, заведено 19 заявок", "k": "сделано", "id": "0.4.1.9"}, {"t": "Точность просева считается по отметкам людей: 17.09 — 18 верных заявок из 26, лишние закрыты", "k": "сделано", "id": "0.4.1.10"}], "id": "0.4.1"}, {"t": "Осталось", "k": "вопрос", "c": [{"t": "Свои учётные записи вместо общего пароля", "k": "вопрос", "n": "дашборд показывает работу конкретных людей; чтобы дать доступ РОПу, нужен отдельный вход", "id": "0.4.2.0"}, {"t": "Уточнить план по менеджеру", "k": "вопрос", "n": "сейчас 120 звонков в день для всех; у разных людей он может быть разным", "id": "0.4.2.1"}, {"t": "Показывать расшифровки звонков прозвона", "k": "вопрос", "n": "сейчас распознаются только звонки с общих номеров; для прозвона решение не принято", "id": "0.4.2.2"}], "id": "0.4.2"}], "id": "0.4"}, {"t": "Связка CRM и 1С: зарплата и техника", "k": "план", "n": "Новый проект, заведён 18.09.2026. Кода нет: ждём доступа к 1С и решения по полям в CRM.", "c": [{"t": "Кто за что отвечает", "k": "решение", "c": [{"t": "CRM — сделка и решения РОПа", "k": "план", "n": "ИНН заказчика и исполнителя, объект, техника, часы, ставки. Процент менеджера и доли между менеджерами.", "id": "0.5.0.0"}, {"t": "1С — деньги", "k": "план", "n": "Реализация, документы исполнителя, НДС и НП, факт и дата оплаты, дебиторка.", "id": "0.5.0.1"}, {"t": "Наш сервис — расчёт", "k": "план", "n": "Дельта, проценты, переносы по оплате, удержание 30% по ДЗ, ведомость и остаток к выдаче.", "id": "0.5.0.2"}], "id": "0.5.0"}, {"t": "Как считается зарплата", "k": "выяснено", "n": "Разобрано по файлу менеджера: 69 листов, история с 2020 года.", "c": [{"t": "Дельта = (заказчик − НДС − НП) − (исполнитель − НДС − НП) − расходы/1,22", "k": "выяснено", "id": "0.5.1.0"}, {"t": "ЗП по сделке = дельта × процент менеджера", "k": "выяснено", "id": "0.5.1.1"}, {"t": "В месяц входят только оплаченные сделки", "k": "выяснено", "n": "Август 2026: вся дельта 639 066, без задолженности 378 262, с переносами 492 607.", "id": "0.5.1.2"}, {"t": "Удержание 30% по дебиторке старше трёх месяцев", "k": "выяснено", "id": "0.5.1.3"}, {"t": "Остаток к выдаче — долг компании перед сотрудником", "k": "риск", "n": "У Сибирякова на конец августа 325 100. Накапливается из месяца в месяц.", "id": "0.5.1.4"}], "id": "0.5.1"}, {"t": "Узкое место: процент и доли назначает РОП", "k": "риск", "n": "Формулы нет — это решение человека. Сегодня живёт в голове РОПа и в ячейке Excel. Пока у него нет места в данных, расчёт не собрать целиком.", "c": [{"t": "Предложено: поля в заявке CRM", "k": "вопрос", "n": "Процент, «делится с», доля. Заполняет РОП при согласовании. Ответа владельца пока нет.", "id": "0.5.2.0"}], "id": "0.5.2"}, {"t": "Порядок работ", "k": "план", "c": [{"t": "0. Доступ и опись данных", "k": "вопрос", "n": "Письмо администратору готово. Первым делом опись, а не код.", "id": "0.5.3.0"}, {"t": "1. Сверка августа до копейки", "k": "план", "n": "Пока не сходится — дальше не идём.", "id": "0.5.3.1"}, {"t": "2. Поля решений РОПа в CRM", "k": "план", "id": "0.5.3.2"}, {"t": "3. Связка документов реквизитом «Заявка CRM»", "k": "план", "n": "Расширением. Типовую конфигурацию не трогаем.", "id": "0.5.3.3"}, {"t": "4. Автоматический расчёт месяца", "k": "план", "id": "0.5.3.4"}, {"t": "5. Месяц-два параллельно с Excel", "k": "план", "n": "Переходим, когда три месяца подряд сойдутся.", "id": "0.5.3.5"}, {"t": "6. Учёт техники в УАТ", "k": "перспектива", "id": "0.5.3.6"}], "id": "0.5.3"}, {"t": "Чего не делаем", "k": "решение", "c": [{"t": "Не переносим расчёт внутрь 1С", "k": "решение", "n": "Правила ещё будут меняться, а каждая правка там — работа программиста и риск для боевой базы.", "id": "0.5.4.0"}, {"t": "Не правим типовую конфигурацию", "k": "решение", "id": "0.5.4.1"}, {"t": "Не читаем напрямую из SQL", "k": "решение", "n": "Таблицы 1С называются _Document137 и меняются при обновлении.", "id": "0.5.4.2"}, {"t": "Не отменяем Excel сразу", "k": "решение", "n": "Он остаётся эталоном для сверки.", "id": "0.5.4.3"}], "id": "0.5.4"}], "id": "0.5"}, {"t": "Хозяйство: серверы и деньги", "k": "план", "c": [{"t": "Амстердам — разработка, модель, дашборд", "k": "сделано", "n": "72.56.25.105. Файрвол, вход по ключу, fail2ban, резервные копии в Россию.", "id": "0.6.0"}, {"t": "Петербург — боевая телефония", "k": "сделано", "n": "91.220.109.49. Принимает вебхуки ВАТС, скачивает записи, распознаёт. Закрыт 17.09 после 5700 попыток подбора пароля за сутки.", "id": "0.6.1"}, {"t": "Расход на модель", "k": "выяснено", "n": "Разбор разговора $0,0086, просев входящего $0,0064. При 300 исходящих и 50 звонках на общие номера — $91 в месяц; со всем потоком около $175.", "id": "0.6.2"}, {"t": "Остаток на счёте виден на странице качества", "k": "сделано", "n": "18.09 деньги кончились посреди дня, и конвейер встал молча. Теперь остаток считается и краснеет за неделю до конца.", "id": "0.6.3"}, {"t": "384 пропущенных звонка в сутки", "k": "риск", "n": "Больше половины входящих остаются без ответа. Этой дырой никто не занимается.", "id": "0.6.4"}], "id": "0.6"}, {"t": "Команды и адреса", "k": "сделано", "n": "Как подступиться к работе: что набрать в терминале и куда смотреть в браузере.", "c": [{"t": "Команды в терминале сервера", "k": "сделано", "n": "Набираются в терминале, не в окне Claude. После правки настроек — source ~/.bashrc.", "c": [{"t": "asr · asrc · cdasr", "k": "сделано", "n": "Распознавание звонков ВАТС. Первая — перейти и запустить, вторая — с продолжением прошлой сессии, третья — только перейти.", "id": "0.7.0.0"}, {"t": "dash · dashc · cddash", "k": "сделано", "n": "Дашборд прозвона и ловля потерянных заявок.", "id": "0.7.0.1"}, {"t": "karta · kartac · cdkarta", "k": "сделано", "n": "Карта проектов и журнал работ — то, что вы сейчас читаете.", "id": "0.7.0.2"}, {"t": "1c · 1cc · cd1c (или 1с · 1сс · cd1с)", "k": "сделано", "n": "Связка CRM и 1С. Заведены оба написания, латиницей и кириллицей: bash различает c и с, и привычный набор иначе не находился бы.", "id": "0.7.0.3"}, {"t": "meh · mehc · cdmeh", "k": "сделано", "n": "Сайт механиков meh.techno-res.ru.", "id": "0.7.0.4"}, {"t": "yolo", "k": "сделано", "n": "Запустить Claude в том каталоге, где вы сейчас.", "id": "0.7.0.5"}, {"t": "web", "k": "сделано", "n": "Открыть страницу браузером на сервере и показать текст. Ключи: --links, --html, --shot файл.png, --wait селектор.", "id": "0.7.0.6"}, {"t": "mac-mount · mac-umount", "k": "сделано", "n": "Подключить и отключить папки мака (Загрузки, Документы) через туннель.", "id": "0.7.0.7"}], "id": "0.7.0"}, {"t": "Адреса в браузере", "k": "сделано", "n": "Всё под одним паролем, логин karta.", "c": [{"t": "Карта состояния — /karta/", "k": "сделано", "n": "https://72-56-25-105.nip.io/karta/ — как идут дела, читается сверху вниз.", "id": "0.7.1.0"}, {"t": "Карта компании деревом — /karta/mindmap.html", "k": "сделано", "n": "Эта страница: что откуда следует.", "id": "0.7.1.1"}, {"t": "Дашборд — /dashboard/", "k": "сделано", "n": "Сводка по менеджерам и последние семь дней.", "id": "0.7.1.2"}, {"t": "Возможные заявки — /dashboard/leads", "k": "сделано", "n": "Заведённые машиной заявки: отметить «верная» или «лишняя».", "id": "0.7.1.3"}, {"t": "Качество просева — /dashboard/quality", "k": "сделано", "n": "Точность и полнота, история замеров, остаток денег на модель.", "id": "0.7.1.4"}, {"t": "Отчёт менеджера — /dashboard/report", "k": "сделано", "n": "Строка на разговор: кому звонил, что добавил, потребность клиента дословно.", "id": "0.7.1.5"}, {"t": "Заявки и вердикты — /dashboard/orders", "k": "сделано", "n": "Почему заявка не дошла до сделки.", "id": "0.7.1.6"}, {"t": "Утренний отчёт — /karta/morning.html", "k": "сделано", "n": "Собирается таймером в 7:00 по московскому времени.", "id": "0.7.1.7"}], "id": "0.7.1"}, {"t": "Где что лежит на сервере", "k": "сделано", "c": [{"t": "/home/claude/asr-vats-megafon", "k": "сделано", "n": "Распознавание записей звонков.", "id": "0.7.2.0"}, {"t": "/home/claude/dashboard", "k": "сделано", "n": "Дашборд прозвона, просев входящих, заведение заявок.", "id": "0.7.2.1"}, {"t": "/home/claude/karta", "k": "сделано", "n": "Карта проектов, журнал, эта карта-дерево.", "id": "0.7.2.2"}, {"t": "/home/claude/1c-integration", "k": "план", "n": "Связка CRM и 1С: правила расчёта, план, вопросы админу.", "id": "0.7.2.3"}, {"t": "/home/claude/meh-techno-res", "k": "сделано", "n": "Сайт механиков.", "id": "0.7.2.4"}], "id": "0.7.2"}], "id": "0.7"}, {"t": "Сайт механиков meh.techno-res.ru", "k": "сделано", "n": "Рабочая система службы механиков: задачи на объекты, механики, слесари, фотоотчёты. Живёт отдельно от всего остального.", "c": [{"t": "Где живёт", "k": "сделано", "c": [{"t": "Хостинг Timeweb, аккаунт c73065", "k": "сделано", "n": "Другой хостинг, не наши серверы. В аккаунте есть и другие проекты: new, msk, msk-new, stage_ts. Путь на сервере ~/meh/public_html, а не ~/public_html.", "id": "0.8.0.0"}, {"t": "Локальная копия /home/claude/meh-techno-res", "k": "сделано", "n": "Под git с 15.09.2026, ветка main, remote нет — история только на этом сервере.", "id": "0.8.0.1"}, {"t": "Выкладка копированием файлов", "k": "сделано", "n": "Сборки нет: composer и node на хостинге недоступны. Git в выкладке не участвует.", "id": "0.8.0.2"}], "id": "0.8.0"}, {"t": "Правила правки", "k": "решение", "c": [{"t": "Статусы задач — только через справочник", "k": "решение", "n": "Никаких status = 'verified' в коде: справочник task_statuses и хелперы из includes/functions.php. Смена статуса — исключительно через change_task_status().", "id": "0.8.1.0"}, {"t": "Вывод через e(), запросы подготовленные, формы с csrf", "k": "решение", "id": "0.8.1.1"}, {"t": "css и js подключать с ?v=filemtime", "k": "решение", "n": "Иначе браузеры держат старое сутками.", "id": "0.8.1.2"}, {"t": "config.php не публиковать и не коммитить", "k": "решение", "n": "Там реквизиты базы. Рядом лежит config.php.example с пустым паролем.", "id": "0.8.1.3"}, {"t": "Коммитить через sudo -u claude с umask 002", "k": "решение", "n": "Репозиторий принадлежит claude, агент работает под agent: иначе объекты в .git теряют групповую запись.", "id": "0.8.1.4"}], "id": "0.8.1"}, {"t": "Что мешает", "k": "риск", "c": [{"t": "Пароль главного механика по умолчанию", "k": "риск", "n": "До сих пор в силе, и уходит по сети открытым текстом — сайт работает по http.", "id": "0.8.2.0"}, {"t": "Нет сертификата: сайт по http", "k": "риск", "n": "Let's Encrypt на хостинге Timeweb. Из-за этого нельзя принимать вебхуки бота MAX и пароли идут открытыми.", "id": "0.8.2.1"}, {"t": "Remote у репозитория нет", "k": "риск", "n": "История живёт только на этом сервере. Пуш невозможен, пока не заведён репозиторий и свой деплой-ключ.", "id": "0.8.2.2"}], "id": "0.8.2"}, {"t": "Архив ранних наработок", "k": "выяснено", "n": "archive/ — SQL первой версии, инструкция по развёртыванию, старые сборки, прототип GPT, хронология работ. История, в работе не используется.", "id": "0.8.3"}], "id": "0.8"}, {"t": "Учебник «Спецтехника с нуля»", "k": "сделано", "n": "Сто страниц, по которым обучают новых менеджеров. Владелец дал 17.09.2026, чтобы машина понимала специфику и судила о звонке по стандарту компании, а не общими словами о продажах.", "c": [{"t": "Как встроен в работу", "k": "сделано", "c": [{"t": "Выжимка в app/knowledge.py", "k": "сделано", "n": "Не пересказ, а рабочий минимум: как считается смена, чем техника отличается, какие вопросы менеджер обязан задать, что предложить в дополнение. 227 строк.", "id": "0.9.0.0"}, {"t": "Чек-листы по 27 видам техники", "k": "сделано", "n": "Автокран, автовышка, телескопический погрузчик, асфальтоукладчик, дорожная фреза, гусеничный экскаватор, экскаватор-погрузчик, мини-экскаватор, самосвал, манипулятор, пухто, трал, фронтальный погрузчик, бульдозер и другие. Ключи написаны так, как технику называют в жизни, включая жаргон: «гусянка» — гусеничный экскаватор.", "id": "0.9.0.1"}, {"t": "Что предложить в дополнение", "k": "сделано", "n": "Раздел UPSELL: например, асфальтоукладчик без катка — упущенная продажа.", "id": "0.9.0.2"}, {"t": "Специфика уходит в каждый запрос к модели", "k": "сделано", "n": "Блок DOMAIN: смена в городе 7 часов работы плюс час подачи («7+1»), ближний пригород «7+2», пороги трала, падение грузоподъёмности на вылете. Около тысячи токенов в каждом запросе — за это и платим.", "id": "0.9.0.3"}], "id": "0.9.0"}, {"t": "Что учебник даёт на деле", "k": "выяснено", "c": [{"t": "Подсказка новичку в карточке клиента", "k": "перспектива", "n": "Чек-лист по технике, о которой клиент говорил в прошлый раз. Собрано, но выключено — ждёт поля в CRM.", "id": "0.9.1.0"}, {"t": "Разбор видит упущенное по стандарту", "k": "сделано", "n": "Без учебника модель писала «уточнить потребность» там, где по стандарту надо было спросить точный вес груза и вылет стрелы.", "id": "0.9.1.1"}], "id": "0.9.1"}, {"t": "Правило обращения с ним", "k": "решение", "n": "Правку сверять с учебником, а не дописывать по памяти: цифры здесь — рабочие правила компании, и выдуманное значение уйдёт в оценку работы живых людей.", "id": "0.9.2"}], "id": "0.9"}, {"t": "История решений", "k": "решение", "n": "Почему всё устроено именно так. Каждое решение с причиной — чтобы через полгода не переспорить самих себя.", "c": [{"t": "Два сервера, разделены по географии", "k": "решение", "n": "Телефония в России, разбор моделью и разработка в Амстердаме. МегаФон не пускает зарубежные адреса, OpenAI и Anthropic не обслуживают российские. Это ограничение, а не неудобство: свести на один сервер невозможно.", "id": "0.10.0"}, {"t": "Распознавание моделью small, а не base", "k": "решение", "n": "16.09.2026. Точнее на телефонном звуке, но втрое дороже по процессору. base остаётся запасным в models/. Если сервер перестанет справляться с потоком — смотреть сюда первым делом.", "id": "0.10.1"}, {"t": "Дорожки звонка считаются одновременно", "k": "решение", "n": "17.09. Распознавание ускорилось вдвое: 0,66 → 0,34 от длительности записи. Каждый звонок считается дважды — оператор и клиент отдельно, — и это единственный способ различить роли.", "id": "0.10.2"}, {"t": "Заявка заводится сразу, человек проверяет потом", "k": "решение", "n": "18.09, решение владельца. Было: находка ждала подтверждения, плюс три часа «менеджер ещё дойдёт до CRM». За три часа заказчик находит технику в другом месте. Лишняя строка в CRM дешевле потерянного заказчика.", "id": "0.10.3"}, {"t": "Звонки берём из ВАТС, а не из CRM", "k": "решение", "n": "18.09. CRM отдавала данные с задержкой и с дырами: у 42 звонков за сутки стояла нулевая длительность при живом трёхминутном разговоре. ВАТС сообщает о законченном разговоре через секунду.", "id": "0.10.4"}, {"t": "Отбор звонков по номерам, а не по именам", "k": "решение", "n": "18.09, решение владельца. Менеджеры приходят и уходят, номера остаются в компании. Подтвердилось сразу: учётка pleskach_artyom принадлежит Быкову, stajer1 — Воронкову, shorokhova_margarita — Кудрину.", "id": "0.10.5"}, {"t": "Главный признак заявки: у кого техника", "k": "решение", "n": "18.09. Кто владеет машиной — тот её сдаёт. Если о наличии говорит собеседник («есть в понедельник», «мы туда не поедем», «три восемьсот в час») — машина у него, заявки нет. На этой путанице машина давала три четверти лишних заявок.", "id": "0.10.6"}, {"t": "Дубли проверяем только после принятого звонка", "k": "решение", "n": "18.09, решение владельца: «создавая такую заявку мы упрощаем работу менеджеру». Прошлое не ворошим; допуск назад — четверть часа, чтобы поймать карточку, заведённую во время самого звонка.", "id": "0.10.7"}, {"t": "Разбираем разговоры от 40 секунд", "k": "решение", "n": "17.09. За двадцать секунд запрос на технику не звучит, а короткие звонки топят список.", "id": "0.10.8"}, {"t": "Заявку по пойманному звонку подтверждает человек — отменено", "k": "решение", "n": "Было принято 17.09, отменено 18.09 в пользу мгновенного заведения. Оставлено в истории, чтобы помнить, почему сначала решили иначе: точность просева была 69%.", "id": "0.10.9"}, {"t": "Расчёт зарплаты не уходит внутрь 1С", "k": "решение", "n": "18.09. CRM отвечает за сделку и решения РОПа, 1С за деньги, считает наш сервис. Правила ещё будут меняться, а каждая правка в 1С — работа программиста, снятие конфигурации с поддержки и риск для боевой базы.", "id": "0.10.10"}, {"t": "Хуки вместо правил в тексте", "k": "решение", "n": "18.09. «Правило в тексте — это пожелание, хук — это закон». Правило из инструкции работает первые полчаса сессии, дальше контекст забит задачей. Обязательное оформлено механизмом: запреты перед командой, проверка перед завершением ответа.", "id": "0.10.11"}, {"t": "Боевой сервер закрыт", "k": "решение", "n": "17.09, вместе с владельцем. Файрвол, запрет входа по паролю, root только по ключу, fail2ban. Поводом стали 5700 попыток подбора пароля за сутки при открытом порте и записях разговоров на борту.", "id": "0.10.12"}, {"t": "Резервные копии: серверы страхуют друг друга", "k": "решение", "n": "17.09. База, настройки и записи уезжают в Россию, оттуда забираются записи боевого сервера. Разбор оплачен запросами к модели, записи из телефонии живут ограниченное время: потеря диска означала потерю невоспроизводимой работы.", "id": "0.10.13"}], "id": "0.10"}, {"t": "Отложено в сторону", "k": "перспектива", "n": "Сделано или разобрано, но не включено. Чтобы не потерять и не начинать заново.", "c": [{"t": "Подсказка менеджеру во всплывающей карточке", "k": "перспектива", "n": "Собрана и проверена на живых клиентах: о чём говорили в прошлый раз, история заявок и сделок, названные цены, чек-лист вопросов по технике из учебника. Выключена: нужно завести в CRM текстовое поле у контакта и сказать его номер. Через API поле не создать — Synergy требует категорию.", "id": "0.11.0"}, {"t": "Подсказки по ходу разговора", "k": "перспектива", "n": "У МегаФона в API нет медиапотока. Нужен либо SIP-транк через наш сервер, либо захват звука на рабочем месте менеджера, плюс около $1200 в месяц за потоковое распознавание. Отложено.", "id": "0.11.1"}, {"t": "Лист «Процент_ТБ» в расчёте зарплаты", "k": "перспектива", "n": "Подтягивает строки из файлов других менеджеров. Владелец сказал пока не трогать.", "id": "0.11.2"}, {"t": "Учёт техники в 1С:УАТ", "k": "перспектива", "n": "Вторая половина задачи по 1С. Начинаем после того, как заработает расчёт зарплаты.", "id": "0.11.3"}, {"t": "Перевод распознавания на whisper-1", "k": "вопрос", "n": "Проба на 30 живых разговорах готова. Границы фраз даёт только whisper-1, у новых моделей OpenAI их нет — для диалога не годятся. Рекомендация: whisper-1 на прозвон (~$90/мес), просев оставить местной модели. Решение за владельцем.", "id": "0.11.4"}, {"t": "Отдельный порт ssh на боевом сервере", "k": "перспектива", "n": "Уберёт шум в логах, но обязательным не является: подбор пароля теперь невозможен.", "id": "0.11.5"}, {"t": "Таймер на разбор прозвона", "k": "вопрос", "n": "Запускается руками. Ночная догонялка за раз разобрала 458 записей — это $4 за ночь; стоит дать ей потолок.", "id": "0.11.6"}, {"t": "Историю Excel развести по годам", "k": "перспектива", "n": "Файл расчёта зарплаты: 69 листов с 2020 года, шесть мегабайт, миллион пустых строк в одном листе. Пока он эталон для сверки — не трогаем.", "id": "0.11.7"}], "id": "0.11"}, {"t": "Ждёт вашего решения", "k": "вопрос", "n": "То, что нельзя решить без владельца.", "c": [{"t": "Поле «Подсказка» в карточке контакта CRM", "k": "вопрос", "n": "Завести текстовое поле и сказать его номер — подсказки включатся в тот же день.", "id": "0.12.0"}, {"t": "Поля «процент» и «доли» в заявке CRM", "k": "вопрос", "n": "Без них расчёт зарплаты не собрать целиком: эти решения принимает РОП, вычислить их нельзя.", "id": "0.12.1"}, {"t": "Ответы системного администратора по 1С", "k": "вопрос", "n": "Письмо готово и лежит в проекте. Главный вопрос — типовые ли конфигурации и стоят ли на поддержке.", "id": "0.12.2"}, {"t": "Распознавание: местная модель или whisper-1", "k": "вопрос", "n": "Проба сделана, цифры есть, нужен ваш выбор.", "id": "0.12.3"}, {"t": "15 находок на странице «возможные заявки»", "k": "вопрос", "n": "Отметить «верная» или «лишняя» — по этим отметкам считается точность на живом потоке.", "id": "0.12.4"}], "id": "0.12"}, {"t": "Грабли, на которые уже наступили", "k": "риск", "n": "Каждая стоила времени. Записаны, чтобы не повторять.", "c": [{"t": "Время звонка хранилось в двух видах", "k": "риск", "n": "Из ВАТС приходит UTC без пометки, из CRM — с московским смещением. Сравнение строк врало, и новое правило молча не работало. Нашлось только на проверке живого звонка.", "id": "0.13.0"}, {"t": "Git экранирует кириллические имена файлов", "k": "риск", "n": "Проверка синтаксиса пропускала файлы с русскими именами: git отдаёт их как «scripts/_\\320\\277…». Лечится core.quotepath=false.", "id": "0.13.1"}, {"t": "Файлы журнала SQLite остались от чужого пользователя", "k": "риск", "n": "Сервис под claude не мог писать в базу: «attempt to write a readonly database». Это была грязь от моих же проверок под agent.", "id": "0.13.2"}, {"t": "Копирование файлов между разошедшимися копиями кода", "k": "риск", "n": "Выкатил на боевой файл из здешней ветки — сервис упал и четыре минуты перезапускался по кругу. На боевой только точечным патчем.", "id": "0.13.3"}, {"t": "«Объявление» значит две противоположные вещи", "k": "риск", "n": "Авито — это наше объявление об аренде, звонит заказчик. Объявление менеджера в группах — звонит исполнитель. Из-за путаницы проверка теряла настоящих клиентов.", "id": "0.13.4"}, {"t": "429 от OpenAI — не всегда лимит скорости", "k": "риск", "n": "Полчаса чинил выдержку темпа, а на счёте просто кончились деньги. Теперь остаток виден на странице качества.", "id": "0.13.5"}, {"t": "Половина расшифровок шла без разделения сторон", "k": "риск", "n": "84 из 146 звонков просеивались по склеенному тексту, где роли определить невозможно. На разделённых точность 92%, на склеенных 82%.", "id": "0.13.6"}, {"t": "Запреты ловили собственную документацию", "k": "риск", "n": "Первые версии правил срабатывали на упоминание команды в тексте. Теперь матчится только настоящий вызов в начале сегмента.", "id": "0.13.7"}], "id": "0.13"}, {"t": "Цифры, которые стоит помнить", "k": "выяснено", "c": [{"t": "735 входящих звонков в сутки", "k": "выяснено", "n": "Из них 224 на номера отдела продаж — это и есть цифра, которую видит владелец в кабинете ВАТС. Отвеченных 351.", "id": "0.14.0"}, {"t": "384 пропущенных звонка в сутки", "k": "риск", "n": "Больше половины входящих. Заказчик, который не дозвонился, потерян так же надёжно, как тот, о ком не завели заявку.", "id": "0.14.1"}, {"t": "Точность просева 95,8% при полноте 92%", "k": "выяснено", "n": "На 90 размеченных разговорах. Утром 18.09 было 63%.", "id": "0.14.2"}, {"t": "От трубки до заявки — около минуты", "k": "выяснено", "n": "Живой замер: 25 секунд от конца разговора до вердикта. Утром было 6,8 часа.", "id": "0.14.3"}, {"t": "Разбор разговора $0,0086, просев $0,0064", "k": "выяснено", "n": "При 300 исходящих и 50 звонках на общие номера — $91 в месяц; со всем потоком входящих около $175.", "id": "0.14.4"}, {"t": "Долг компании перед менеджером 325 100", "k": "риск", "n": "Остаток к выдаче у Сибирякова на конец августа, накопленный за год. Автоматизировать придётся и его.", "id": "0.14.5"}], "id": "0.14"}, {"t": "Рассмотрено, но не взято", "k": "решение", "n": "Чтобы не начинать тот же разбор заново", "c": [{"t": "Yandex SpeechSense", "k": "решение", "n": "Готовая речевая аналитика: сама выгружает записи из телефонии, распознаёт, ищет смыслы в диалогах — отработку возражений, удовлетворённость клиента, вовлечённость оператора. Построена на SpeechKit, YandexGPT и подключаемых сторонних моделях. Есть REST API и готовая интеграция с Битрикс24. По сути — коробочная версия того, что мы собрали руками. Изучено 16.09.2026. · [{'label': 'Распознавание, до 100 тыс. минут', 'value': '0,606 ₽/мин'}, {'label': 'Аналитика, до 100 тыс. минут', 'value': '1,398 ₽/мин'}, {'label': 'Обязательная подписка, минимум', 'value': '45 000 ₽/мес'}, {'label': 'Наш поток «с рекламы» (480 мин/мес)', 'value': '962 ₽ по факту'}, {'label': 'Весь поток компании (13 750 мин/мес)', 'value': '27 556 ₽ по факту'}, {'label': 'Сейчас у нас: распознавание', 'value': '0 ₽, локально'}, {'label': 'Сейчас у нас: разбор через OpenAI', 'value': '≈500 ₽/мес'}] · Вердикт: {'label': 'Пока не берём', 'cls': 'warn', 'text': 'ради звонков с общих номеров бессмысленно — 45 тысяч подписки против нынешних пятисот рублей, и связку с Synergy всё равно писать.'} · Вернуться, если если решите контролировать весь поток компании — 625 минут разговоров в день, с тегами и скриптами. Тогда 90 000 ₽ в месяц против своей разработки — честное сравнение. Отдельно стоит спросить у Яндекса, можно ли взять только распознавание без аналитики: это 8 300 ₽ за весь поток, качество выше нашего, а разбор оставить свой.", "id": "0.15.0"}], "id": "0.15"}, {"t": "Журнал работ", "k": "план", "n": "Что решали и почему — по дням", "c": [{"t": "2026-09-22", "k": "план", "n": "4 записей", "c": [{"t": "Три причины дублей в заявках, все устройственные", "k": "выяснено", "n": "Владелец и РОПы проверяли заявки и нашли дубли. Разбор: первое — сценарий выбирался по «совпал diversion ИЛИ telnum», поэтому звонок на рекламный номер, переведённый на менеджера, разбирался как личный (8 заявок из 18). Второе — список открытых заявок клиента вычислялся и выбрасывался (after, _active = ...), и повторный звонок давал дубль. Третье и главное — Synergy сама заводит заявку на входящий", "id": "0.16.0.0"}, {"t": "Дописываем заявку Synergy вместо второй рядом", "k": "решение", "n": "Почему: Два лида на одно обращение — это не только мусор в базе, это ещё и два человека, которые думают, что клиентом занимается кто-то другой. А срок свежести нужен потому, что закрывают заявку только «Сделка» и «Сделка провалена»: брошенный «Новый» висит открытым годами (нашлись 139, 169 и 836 дней) и съедал бы новые запросы от старых клиентов — ровно те заказы, про которые менеджер и забывает.", "id": "0.16.0.1"}, {"t": "Видно, из какого звонка выросла заявка", "k": "сделано", "n": "РОПы открывали заявку, видели в активности несколько звонков и слушали подряд. Заведены два поля: у заявки «Пойманная с прослушки» (время, длительность, номер клиента), у звонка — «Заявка по этому звонку». Проставлены задним числом на все 55 заявок. Попутно выяснилось, что поля в Synergy создаются через API, если указать категорию — прежняя запись об обратном неверна.", "id": "0.16.0.2"}, {"t": "Подсчёт потерянных заявок за август и сентябрь", "k": "открыто", "n": "Набор подготовлен: 2 770 звонков на прямые номера менеджеров продаж — август 1 674, 01–18 сентября 1 096. Рекламные номера исключены. 51,7 часа звука на просев. Цена: местной моделью около $18,5 и 18 часов счёта в Амстердаме, через whisper-1 около $55,5. На счёте $26,58 — местный путь проходит, второй нет. Владелец отложил до согласования оплаты за транскрибацию. Срочности нет: записи в ВАТС храня", "id": "0.16.0.3"}], "id": "0.16.0"}, {"t": "2026-09-21", "k": "план", "n": "10 записей", "c": [{"t": "Дашборд считал работу пятнадцати человек как работу одного", "k": "выяснено", "n": "Владелец сказал: «мне не нравится, как он работает». Разбор показал, что дело не в удобстве, а в цифрах. Признак «звонок прозвона» (in_group) сборщик ставил по всей таблице сотрудников. Пока в ней был один прозвон, это было верно; 18.09 туда добавили отдел продаж — ради поиска потерянных заявок во входящих — и с того дня их исходящие помечались звонками прозвона. К 21.09 в отчёте об одном человеке", "id": "0.16.1.0"}, {"t": "Метрики прозвона очищены, история пересчитана", "k": "сделано", "n": "«Свои» теперь берутся по отделу (group_logins, настройка group_dept), входящий звонок звонком прозвона быть не может. Ряд «Последние семь дней» ограничен прозвоном. История приведена в порядок скриптом scripts/fix_in_group.py: сборщик старые строки не переписывает, сохранение звонка идемпотентно. Скрипт считает признак заново, а не правит разницу, поэтому запускать его можно сколько угодно раз, а", "id": "0.16.1.1"}, {"t": "Настоящая выработка менеджера прозвона", "k": "выяснено", "n": "После чистки видно то, чего не было видно раньше: 15.09 — 124 звонка (103% плана), 16.09 — 57 (48%), 17.09 — 98 (82%), 18.09 — 62 (52%), выходные — ноль. Раньше на тех же днях экран показывал 831 и 943 звонка. План в среднем не выполняется, и именно это дашборд был обязан показать с самого начала.", "id": "0.16.1.2"}, {"t": "Новый отдел не попадает в счётчики по умолчанию", "k": "решение", "n": "Почему: Ошибка стоила трёх дней неверных цифр и не была замечена ни тестами, ни ночной диагностикой: обе смотрели на тот же испорченный признак. Умолчание «считаем всех, кто есть в таблице» тихо меняет смысл отчёта при каждом расширении базы.", "id": "0.16.1.3"}, {"t": "Что ещё нашлось в дашборде и пока не тронуто", "k": "открыто", "n": "Владелец выбрал чинить первые два пункта. Осталось: разбор разговоров потоком не идёт (DASH_TRANSCRIBE_ENABLED=false, хвост 295 неразобранных разговоров прозвона, последний массовый прогон 17–18.09); дисциплина CRM меряется по чужим карточкам (из 1717 проверок только 723 про прозвон); обратная связь по просеву мертва — из 271 просева отметки человека нет ни на одном, 49 находок ждут; 8 заявок в Sy", "id": "0.16.1.4"}, {"t": "Боевой сервер расширен и настроен под новое железо", "k": "сделано", "n": "Владелец добавил ресурсов: 2 ядра → 8, 3,9 ГБ → 12 ГБ, 49 ГБ → 97 ГБ. Применилось двумя перезагрузками. Настройки распознавания остались от двухъядерной машины и новые ядра простаивали — при счёте load держался 2–3 из 8. Подобрано замером: ASR_CPU_THREADS=8, ASR_MAX_CONCURRENT_JOBS=2. Запись 288 с: было около 290 с счёта, стало 192 с. На дорожку 0,40 от длительности против прежних ~0,5.", "id": "0.16.1.5"}, {"t": "OOM убивал боевой сервис 25 раз за неделю", "k": "выяснено", "n": "До расширения: модель medium в 3,9 ГБ, а рядом каждые 15 минут таймер asr-backfill поднимал вторую копию модели — 2,0 ГБ плюс 1,5 ГБ. За семь суток 83 убийства догоняющего процесса и 25 — самого сервиса. Каждое убийство сервиса теряло живой звонок молча: ни «пропущен», ни ошибки, процесс просто обрывался. Так пропал 14-минутный разговор на рекламный номер «Авито Автолайн». Автор юнита про нагрузку", "id": "0.16.1.6"}, {"t": "Параллельные дорожки на боевой не выкатывались", "k": "выяснено", "n": "Настройка ASR_CHANNEL_PARALLELISM в конфиге боевого есть, а кода, который её читает (transcribe_tracks), нет: правка от 18.09 осталась в амстердамской копии. Дорожки считаются по очереди, и половина машины простаивает. Восемь потоков против четырёх дают лишь 8% — CTranslate2 упирается примерно в четыре. Настоящее ускорение вдвое даст только выкатка кода: 29 строк в transcriber.py и два места вызов", "id": "0.16.1.7"}, {"t": "Пересылка входящих закоммичена на боевом", "k": "сделано", "n": "Правка от 18.09, на которой держится поиск потерянных заявок, три дня жила незакоммиченной в /opt/asr. Документированный откат там — git checkout ., и он стёр бы рабочую пересылку. Закоммичено.", "id": "0.16.1.8"}, {"t": "Сторож не смотрит на то, что само заживает", "k": "решение", "n": "Почему: За один день это третий случай одного и того же: механизм есть, отчёт приходит, и оба слепы по построению. Утром — сторож, смотревший через тот же испорченный признак, что и отчёт. Днём — сторож, смотревший на симптом, который сам себя лечит. Общее правило: проверять надо то, что не восстанавливается само, и желательно вторым способом, независимым от первого.", "id": "0.16.1.9"}], "id": "0.16.1"}, {"t": "2026-09-20", "k": "план", "n": "11 записей", "c": [{"t": "Утренний отчёт починен — он молчал двое суток", "k": "сделано", "n": "Секция расходов читала .env напрямую, а юнит работает под agent — файл закрыт правами 600 на claude. Проверка стояла только на существование файла, и PermissionError роняла весь отчёт целиком, включая секции, которым .env не нужен. Сумма пополнения теперь достаётся тремя заходами, а если не вышло ничем — строка про остаток не исчезает молча, а встаёт в отчёт со статусом «внимание».", "id": "0.16.2.0"}, {"t": "Коды возврата разведены: находки — не поломка", "k": "решение", "n": "Почему: Механизм без сторожа есть намерение. Если «failed» горит всегда, он перестаёт что-либо значить — и поломка живёт незамеченной ровно до тех пор, пока её не найдут руками.", "id": "0.16.2.1"}, {"t": "Раздел «Транспорт»: 11 667 карточек, но 3 189 исполнителей", "k": "выяснено", "n": "Обойдена вся база целиком, 234 страницы без сбоев. Живых карточек 8 576, в архиве 14%. Телефон есть у 73%, тип техники — у 85%; вместе, то есть пригодных к адресации, — 8 576 карточек на 3 189 уникальных исполнителей: в среднем 1,9 карточки на владельца, у одного номера их 17. Связь с контактом есть у 92%, с компанией — у 2%, с заявками — 0%. «Где базируется» заполнено на 8,7%, «Статус» исполнител", "id": "0.16.2.2"}, {"t": "Поправка: справочники техники сводить не надо", "k": "выяснено", "n": "Вчера было сказано, что словарь заявки (53 значения) и словарь карточек (72) расходятся и это надо сводить. Для рабочей схемы это неверно. Расхождение — у поля «Основная техника» на заявке, а его не заполняют вообще: ноль из 400 последних. Живая связка другая: у сделки есть не поле, а связь transport-type с тем же справочником, что у карточек техники, и она заполнена на 97%. Обе стороны уже говоря", "id": "0.16.2.3"}, {"t": "Заявки живут в сделках, а не в заявках", "k": "выяснено", "n": "То, что в CRM называется «заявка» (orders), — это автоматические записи о входящих звонках: у свежей заполнены только источник и номер, name равно «-». Настоящее содержание в сделках: адрес объекта 98%, количество единиц 90%, условия доставки 90%, тип техники 97%. Зато area — район — заполнен на 0%, а связь performers (исполнители) — на 5%.", "id": "0.16.2.4"}, {"t": "Synergy умеет кнопку на карточке", "k": "выяснено", "n": "У сценариев есть тип запуска manual — 113 из 1 000 в выборке — и поле manual-required-fields, то есть кнопку можно не дать нажать, пока не заполнены нужные поля. Другие компании на этой же CRM такие кнопки держат: «В доставку», «Отправить Прайс», «Подготовить Договор». Чем именно кнопка может ответить — через API не видно, действия сценариев Synergy не отдаёт.", "id": "0.16.2.5"}, {"t": "Бот оповещения исполнителей: Telegram, подписка на технику и район", "k": "решение", "n": "Почему: Автокран — 18% потока заявок: при 60 сделках в день это 11 сообщений в сутки на всех 447 подписчиков. Без района человек получит одиннадцать заявок, из которых подойдут две, и отпишется за неделю. Второй раз на ссылку не нажимают, поэтому фильтр — не украшение, а условие выживания канала. Отклик «Беру» попутно заполняет performers, который сейчас пуст на 95%.", "id": "0.16.2.6"}, {"t": "Размер рассылки по типам техники", "k": "выяснено", "n": "Экскаватор погрузчик — 894 исполнителя, гусеничный экскаватор — 694, самосвал — 659, манипулятор — 507, автокран — 447. Медиана по типу — 25 человек, типов с кем работать — 67. Поток заявок 55–85 в рабочий день. Без телефона 1 136 живых карточек — этих в бота не позвать вообще.", "id": "0.16.2.7"}, {"t": "Synergy отдаёт сценарии чужих аккаунтов", "k": "выяснено", "n": "По нашему API-ключу в выборке из 1 000 сценариев нашлось 70 разных компаний, наших там 173. Названия сценариев у нас содержат телефоны вида «изм источника авито79259863525» — значит, и наши, вероятно, видны другим. Ошибка доступа на стороне Synergy, чинить её нам нечем.", "id": "0.16.2.8"}, {"t": "Может ли кнопка Synergy позвать наш адрес", "k": "открыто", "n": "Что кнопка существует — подтверждено. Умеет ли её действие сделать HTTP-вызов наружу — надо посмотреть глазами в настройках сценария или спросить поддержку. Если не умеет, схема всё равно работает: кнопка проставляет в сделке «Оповестить = Да», а наш сервис раз в минуту забирает такие сделки — мы уже опрашиваем Synergy для дашборда.", "id": "0.16.2.9"}, {"t": "Разбор прозвона идёт руками, а менеджеров станет пятеро", "k": "открыто", "n": "analyze_calls.py не стоит ни на одном таймере: автоматизированы только входящие. Видно в отчёте за 19.09 — «разговоров дольше 40 с: 2, записей скачано 0, разобрано 0». Владелец планирует набрать ещё 2–4 менеджера на прозвон. С одним это терпимо, с пятерыми инструмент контроля станет бесполезным в тот день, когда запустить забудут. Поставить на таймер до найма, а не после.", "id": "0.16.2.10"}], "id": "0.16.2"}, {"t": "2026-09-18", "k": "план", "n": "31 записей", "c": [{"t": "Заявку заводим сразу, проверяем постфактум", "k": "решение", "n": "Почему: За три часа заказчик успевает найти технику в другом месте. Лишняя строка в CRM стоит минуты работы, потерянный заказчик — сделки.", "id": "0.16.3.0"}, {"t": "От трубки до заявки — минута вместо семи часов", "k": "сделано", "n": "Замер по вчерашним данным: от конца разговора до просева проходило 6,8 часа в среднем, худший случай — 30 часов. Убрано трёхчасовое ожидание, записи и просев переведены с часа на минуту. Живой звонок сегодня прошёл весь путь — от «положил трубку» до вердикта — за 25 секунд.", "id": "0.16.3.1"}, {"t": "Звонки берём из ВАТС, а не из CRM; привязка по номерам", "k": "сделано", "n": "Почему: CRM отдавала данные с задержкой и с дырами: у 42 звонков за 17.09 стояла нулевая длительность, хотя разговор шёл по три-шесть минут.", "id": "0.16.3.2"}, {"t": "Наши числа сошлись с ВАТС: 224 входящих на отдел продаж", "k": "выяснено", "n": "Владелец увидел в кабинете 224 входящих за 17.09, у нас значилось 264 и 735. Сверка через сам ВАТС: за сутки 735 входящих всего — ровно столько же, сколько у нас. Из них на номера отдела продаж — 224, это и есть цифра владельца. Отвеченных 351, пропущенных 384, дольше 40 секунд — 238.", "id": "0.16.3.3"}, {"t": "Половина просева шла по склеенной расшифровке", "k": "выяснено", "n": "У 84 из 146 просеянных звонков стороны в расшифровке не были разделены — их считали до починки разделения дорожек. Роли в таком тексте определить невозможно в принципе. На разделённых расшифровках точность просева 92%, на склеенных — 82%. Записи пересчитаны заново, находки пересеяны.", "id": "0.16.3.4"}, {"t": "Точность просева доведена с 63% до 92%", "k": "сделано", "n": "Заведён проверочный набор: 84 разговора с известным ответом, размеченных по полным расшифровкам. Написана мерялка — прогоняет просев по набору и считает точность и полноту, разбивая ошибки по видам. Каждая правка запроса теперь проверяется цифрой, а не на ощупь. Итог дня: точность 92,3%, полнота 96,0% — цель в 90% взята. Главная правка — научить машину отличать заказчика от исполнителя: на этой пу", "id": "0.16.3.5"}, {"t": "Куда уходил бюджет OpenAI", "k": "выяснено", "n": "За 17.09 обработано не 184 звонка, а около 850 обращений к модели: 458 из них — ночная догонялка хвоста за прошлые дни, 146 просев, 171 разбор заявок с общих номеров. Обычные сутки стоят $2,5–3, то есть около $80 в месяц; вчерашний всплеск дали разовые догонялки и пробы. Поставлен свой учёт: каждый ответ модели записывается с числом токенов и ценой, в утреннем отчёте появился раздел «Расход на мод", "id": "0.16.3.6"}, {"t": "Выжимка появилась и у заявок с общих номеров", "k": "сделано", "n": "Поле «выжимка» завели 17.09, и заполнял его только дашборд у заявок «Пойманная с прослушки». У заявок, которые CRM заводит по звонку с рекламы, поле оставалось пустым, хотя разбор по ним есть. Исправлено на боевом сервере, 25 прошлых заявок дозаполнены.", "id": "0.16.3.7"}, {"t": "Механизмы сессии поставлены в ASR и карту", "k": "сделано", "n": "Кит из чужой методики, разобранный вчера, поставлен в оставшиеся два проекта. В ASR главный сторож — запрет закончить работу, если код правили, а сервис не перезапускали: без рестарта проверяется старый код. В карте — запрет править собранную страницу руками и запрет закончить с невыложенной картой. По дороге в ките нашлась дыра: проверка синтаксиса пропускала файлы с русскими именами, потому что", "id": "0.16.3.8"}, {"t": "Подсказка менеджеру во всплывающей карточке звонка", "k": "открыто", "n": "Идея владельца: новичку в момент звонка показывать, с кем он говорит и что спрашивать. Карточку CRM показывает сама, но в ней только то, что завели руками. Подсказка собрана и проверена на живых клиентах: о чём говорили в прошлый раз, история заявок и сделок, названные цены, чек-лист вопросов по этой технике из учебника компании. Отложено по решению владельца. Чтобы включить, нужно завести в CRM т", "id": "0.16.3.9"}, {"t": "384 пропущенных звонка за сутки", "k": "открыто", "n": "Больше половины входящих вчера остались без ответа. Это другая дыра, не та, которую мы закрываем: заказчик, который не дозвонился, потерян так же надёжно, как тот, о ком менеджер не завёл заявку. Стоит посмотреть отдельно — кто не берёт трубку и в какие часы.", "id": "0.16.3.10"}, {"t": "Отбор звонков — по номерам менеджеров, а не по именам", "k": "решение", "n": "Почему: Решение владельца. Имена и учётки в ВАТС не соответствуют людям, номера — единственное устойчивое.", "id": "0.16.3.11"}, {"t": "Владелец прослушал 39 заявок и разметил ошибки", "k": "выяснено", "n": "Из тридцати девяти заявок, заведённых машиной, 29 переведены в «сделка провалена»: 12 с пометкой «дубль ИИ», 9 — «ошибка ИИ», 8 без пометки (настоящие проигранные сделки). Дубли. Во всех случаях заявка менеджера была создана в момент звонка: он заводит карточку, пока телефон звонит, и её метка времени оказывается на минуту-две раньше начала разговора у нас. Проверка «появилась ли заявка после звон", "id": "0.16.3.12"}, {"t": "Главный признак заявки: у кого техника", "k": "решение", "n": "Почему: Девять ошибок из девяти, помеченных владельцем, объяснялись именно этим.", "id": "0.16.3.13"}, {"t": "Дубли проверяем только после принятого звонка", "k": "решение", "n": "Почему: Слова владельца: «создавая такую заявку мы упрощаем работу менеджеру». Лишняя строка в CRM дешевле потерянного заказчика.", "id": "0.16.3.14"}, {"t": "Критерии отбора записаны, ошибки возвращаются в набор сами", "k": "сделано", "n": "Появился живой документ с правилами: какие звонки берём, что делаем по шагам, когда заявку заводим и когда нет — с примерами из наших же разговоров. Рядом механизм обучения: владелец помечает заявку в CRM, скрипт находит исходный звонок и кладёт его в проверочный набор с правильным ответом. Пометка владельца важнее моей разметки. Точность на его разметке: 95,8% при полноте 92% против 63% утром.", "id": "0.16.3.15"}, {"t": "Перезвон исполнителя не отличить по словам — только по истории звонков", "k": "выяснено", "n": "Владелец спросил, почему заведена заявка в 15:01. Разговор на 45 секунд: «экскаватор-погрузчик нужен на завтра, планировочный ковш, район станции МЭК» — названа техника, навесное, объект и сроки. Обе ступени просева сказали «заказчик», и по тексту иначе решить было нельзя. Правда оказалась в истории: Толстов звонил на этот номер четыре раза в 14:49–14:51, не дозвонился, и человек перезвонил в 14:5", "id": "0.16.3.16"}, {"t": "Время звонка хранилось в двух видах, и правило молча не работало", "k": "выяснено", "n": "Почему: Механизм без проверки на живых данных выглядит работающим ровно до первого настоящего случая.", "id": "0.16.3.17"}, {"t": "Посреди дня кончились деньги на OpenAI", "k": "выяснено", "n": "Конвейер встал молча: двенадцать входящих подряд остались без просева, пять падений за час. Я сперва принял отказ за лимит по скорости и полчаса чинил выдержку темпа — настоящая причина была в ответе: «You have no credits remaining». Ничего не потеряно: звонки и записи лежат у нас, пакетный просев догоняет хвост сам. По дороге закрыта дыра — два звонка из ВАТС не имели строки проверки по CRM, и па", "id": "0.16.3.18"}, {"t": "Счётчик остатка денег на модель", "k": "сделано", "n": "Почему: Деньги кончились посреди рабочего дня, и узнали мы об этом только по упавшему конвейеру.", "id": "0.16.3.19"}, {"t": "Сколько стоит разбор: цифры для планирования", "k": "выяснено", "n": "По собственному учёту, а не на глаз: разбор одного разговора — $0,0086, просев входящего — $0,0064, вторая ступень — $0,0028. При 300 исходящих и 50 звонках на общие номера в день выходит $3 в день, $91 в месяц; с запасом на длинные разговоры — $120. Плюс поиск потерянных заявок во входящих (264 звонка) ещё $82 в месяц. Всё вместе — около $175 в месяц. Распознавание сейчас местное и бесплатное; пе", "id": "0.16.3.20"}, {"t": "Итоговый замер дня: точность 95,8%, полнота 92%", "k": "выяснено", "n": "Чистый прогон по 90 разговорам с известными ответами, без сбоев. Из 24 заявок, которые машина завела бы, верны 23; из 25 настоящих запросов поймано 23. Четыре звонка отсеяны по истории звонков, без обращения к модели — это перезвоны исполнителей на наш поиск. И точнее, и бесплатно. Осталось три ошибки, и две из них — одна болезнь: первая ступень путается в ролях. Она пытается решить два вопроса ра", "id": "0.16.3.21"}, {"t": "Связка с 1С — отдельный проект", "k": "решение", "n": "Почему: Звонки — конвейер, который крутится сам. Здесь работа с правилами, где ошибка попадает в зарплату живого человека: другой темп и другая цена ошибки.", "id": "0.16.3.22"}, {"t": "Как на самом деле считается зарплата менеджера", "k": "выяснено", "n": "Разобран файл, который менеджер заполняет и присылает на проверку: 69 листов, история с 2020 года, шесть мегабайт. По сделке: дельта = (сумма заказчику − НДС − НП) − (сумма исполнителю − НДС − НП) − прочие расходы / 1,22, умножить на долю менеджера, если сделку делят. ЗП по сделке = дельта × процент менеджера. По месяцу: в дельту входят только оплаченные сделки, неоплаченные переезжают в месяц опл", "id": "0.16.3.23"}, {"t": "Процент и доли назначает РОП — значит им нужно место в данных", "k": "решение", "n": "Почему: Иначе файл всё равно придётся дозаполнять руками, и ошибки останутся там же, где сейчас.", "id": "0.16.3.24"}, {"t": "Расчёт зарплаты не уходит внутрь 1С", "k": "решение", "n": "Почему: Правила ещё будут меняться: сегодня оклад есть, завтра его нет. Каждая правка внутри 1С — работа программиста, снятие конфигурации с поддержки и риск для боевой базы. В коде правку видно и можно проверить на прошлых месяцах.", "id": "0.16.3.25"}, {"t": "Сначала сверка, потом переход", "k": "решение", "n": "Почему: Ошибка здесь попадает не в лог, а в зарплату живого человека. Excel остаётся эталоном, пока машина не докажет, что считает так же.", "id": "0.16.3.26"}, {"t": "Карта компании стала ментальной картой", "k": "сделано", "n": "Почему: Файл XMind хорош один раз: выгрузить, скачать, открыть — и он устарел. Дерево в браузере обновляется само.", "id": "0.16.3.27"}, {"t": "Учебник компании едет в каждый запрос — и это $15 в месяц", "k": "выяснено", "n": "У модели нет памяти между запросами: всё, что ей нужно знать, кладётся заново. В просеве ввод занимает 3 321 токен, из них учебник — около тысячи. OpenAI кеширует повторяющееся начало, и две трети ввода идут за половину цены, поэтому доля учебника — $0,0013 за запрос, порядка $15 в месяц при нынешнем потоке. Чек-листы по технике расход не увеличивают: в запрос уходит только тот, о котором шла речь", "id": "0.16.3.28"}, {"t": "Учебник знает 18 названий техники из 34 прозвучавших", "k": "выяснено", "n": "Проверка по разобранным разговорам: техника называлась 34 разными словами, чек-листы есть для 18. Не узнаёт каток, ямобур, грейдер, виброплиту, вилочный погрузчик, автобетоносмеситель, буровую установку и ещё девять. Для таких звонков разбор остаётся общим. Дописывать учебник сам не буду: это стандарт компании, и выдуманные вопросы уйдут в оценку работы живых людей. Предложено приносить владельцу", "id": "0.16.3.29"}, {"t": "Починена ошибка 415: часть записей не просеивалась месяцами", "k": "сделано", "n": "Почему: Нашлось только при сквозной проверке цепочки в конце дня. Механизм, о поломке которого никто не узнаёт, — это намерение, а не механизм.", "id": "0.16.3.30"}], "id": "0.16.3"}, {"t": "2026-09-17", "k": "план", "n": "30 записей", "c": [{"t": "Боевой сервер закрыт", "k": "сделано", "n": "Почему: 5700 попыток подбора пароля за сутки при открытом порте 22, записях разговоров и токенах на борту.", "id": "0.16.4.0"}, {"t": "Резервное копирование: два сервера страхуют друг друга", "k": "сделано", "n": "Почему: Разбор оплачен запросами к модели, записи из телефонии живут ограниченное время. Потеря диска означала потерю работы, которую нельзя повторить.", "id": "0.16.4.1"}, {"t": "Постоянная связь с маком владельца", "k": "сделано", "n": "Почему: Владелец просил постоянную связь и возможность передавать файлы, не настраивая туннель каждый раз.", "id": "0.16.4.2"}, {"t": "Мак подвисает не от старости, а от нехватки памяти", "k": "выяснено", "n": "Почему: Владелец жаловался на сильные подвисания и спрашивал, не мак ли узкое место. Оказалось — он, но не мощностью процессора, а объёмом памяти.", "id": "0.16.4.3"}, {"t": "День остался без разбора: упал на блокировке базы", "k": "выяснено", "n": "Почему: Три дыры дали один результат: работа целого дня пропала, и заметил это владелец, а не мы.", "id": "0.16.4.4"}, {"t": "Распознавание ускорено вдвое: дорожки считаются одновременно", "k": "сделано", "n": "Почему: Клиент шлёт записи по одной, поэтому параллельность заданий не давала ничего — простаивала половина машины.", "id": "0.16.4.5"}, {"t": "Утренний контур: диагностика в 6:00 и отчёт в 7:00", "k": "сделано", "n": "Почему: Механизм без сторожа — это намерение: падение разбора пролежало незамеченным одиннадцать часов.", "id": "0.16.4.6"}, {"t": "Проба распознавания через API: быстрее в пять раз, но границы фраз даёт только whisper-1", "k": "выяснено", "n": "Почему: Разбор опирается на чередование реплик. Модель без границ фраз бесполезна, какой бы точной ни была.", "id": "0.16.4.7"}, {"t": "Боевой сервер открыт всему интернету", "k": "открыто", "n": "Почему: Амстердамский сервер закрыт по всем этим пунктам после 19 тысяч попыток за двое суток. Боевой остался как был.", "id": "0.16.4.8"}, {"t": "Резервных копий нет ни у базы, ни у записей", "k": "открыто", "n": "Почему: Разбор оплачен запросами к модели, а записи из ВАТС доступны ограниченное время: потеря диска означает потерю работы, которую нельзя повторить.", "id": "0.16.4.9"}, {"t": "Карта проектов теперь собирается и в XMind", "k": "сделано", "n": "Почему: Владельцу удобнее смотреть дерево, а не страницу. Две карты из одного источника не разойдутся.", "id": "0.16.4.10"}, {"t": "Сервер видит папки мака, а в дашборде заведены механизмы-сторожа", "k": "сделано", "n": "Почему: Правило в тексте работает первые полчаса сессии; дальше держит только механизм.", "id": "0.16.4.11"}, {"t": "Роли сторон в записи нельзя определять по каналу", "k": "выяснено", "n": "Почему: без этого невозможно отличить «клиент просит технику» от «наш менеджер ищет её у подрядчика» — а это разница между заявкой и мусором в CRM.", "id": "0.16.4.12"}, {"t": "Боевой разбор звонков с рекламы роли не путает", "k": "выяснено", "n": "Почему: если бы боевой разбор путал стороны, все отчёты по рекламным звонкам за месяцы были бы недостоверны. Проверить стоило прежде, чем чинить.", "id": "0.16.4.13"}, {"t": "Заявку по пойманному звонку подтверждает человек", "k": "решение", "n": "Почему: точность просева 69% — каждая третья заявка мусорная. Автомат при такой точности засоряет CRM быстрее, чем приносит пользу. Вернём, когда дойдёт до 90%: отметки «запроса не было» и подтверждения копятся, считать будет по чему.", "id": "0.16.4.14"}, {"t": "Ловим заявки, о которых менеджер не сказал", "k": "решение", "n": "Почему: входящие на общие номера мы слышим, а прямые звонки менеджеру — слепая зона. Заявка попадает в CRM только если менеджер сразу переводит её в сделку; нет времени или желания — и заказ исчезает.", "id": "0.16.4.15"}, {"t": "Слепая зона — 107 разговоров в день", "k": "выяснено", "n": "Почему: без этой цифры нельзя было выбрать схему: разбирать весь поток целиком — 12,5 часов записи в сутки, это сервер круглосуточно.", "id": "0.16.4.16"}, {"t": "Двухступенчатый просев вместо сплошного разбора", "k": "сделано", "n": "Почему: запрос звучит в начале разговора, и на черновом тексте его видно. Сплошной разбор стоил бы в десять раз дороже и не помещался бы в сутки.", "id": "0.16.4.17"}, {"t": "Заявка «Пойманная с прослушки» заводится сама", "k": "сделано", "n": "Почему: семь из первых восьми запросов были «на завтра» — суточный цикл бесполезен, заявка нужна в тот же час.", "id": "0.16.4.18"}, {"t": "Три грабли Synergy при записи заявки", "k": "выяснено", "n": "Почему: каждая из трёх молча давала неверный результат: заявка доставалась тому же менеджеру, который её и потерял.", "id": "0.16.4.19"}, {"t": "Разобраны все 14 заявок: четыре потеряны без единого звонка", "k": "выяснено", "n": "Почему: «заявка провалена» в CRM не объясняет ничего. Разбор показывает, что половина потерь — не отказ клиента, а несделанный звонок.", "id": "0.16.4.20"}, {"t": "Отчёт менеджера: фильтры в шапке, период «с — по», причина проигрыша в строке", "k": "сделано", "n": "Почему: владелец смотрит таблицу целиком: ради одной фразы проваливаться в каждую заявку он не должен, а отдельная карточка фильтров занимала полэкрана.", "id": "0.16.4.21"}, {"t": "Колонка «задача» врала по всем 570 разговорам", "k": "выяснено", "n": "Почему: цифра «ноль задач» — это обвинение человека в безделье. Один необработанный код ответа превратил рабочий инструмент в клевету.", "id": "0.16.4.22"}, {"t": "Заявки: проваливание и вердикт «почему не дошла до сделки»", "k": "сделано", "n": "Почему: заявку заводит прозвон, а ведёт её другой человек, и его звонки дашборд вообще не собирал. Без них «почему не купили» оставалось догадкой.", "id": "0.16.4.23"}, {"t": "Листание истории обрывалось, и вердикты получались ложными", "k": "выяснено", "n": "Почему: «мы не смотрели» и «менеджер не звонил» — разные вещи. Перепутав их, отчёт из инструмента превращается в источник несправедливых решений.", "id": "0.16.4.24"}, {"t": "Разбираем разговоры от 40 секунд", "k": "решение", "n": "Почему: считать всё подряд — почти восемь часов процессора; в разговорах короче сорока секунд содержания почти нет.", "id": "0.16.4.25"}, {"t": "Разбор звонков прозвона поставлен на конвейер", "k": "сделано", "n": "Почему: по этим строкам судят о работе людей. Ложное обвинение здесь дороже пропущенного пункта.", "id": "0.16.4.26"}, {"t": "Учебник компании встроен в разбор разговоров", "k": "сделано", "n": "Почему: без учебника модель писала «уточнить потребность» там, где по стандарту компании надо было спросить вес груза, вылет стрелы и ширину проезда.", "id": "0.16.4.27"}, {"t": "Восемь разговоров с названной потребностью и без заявки", "k": "выяснено", "n": "Почему: это единственная строка отчёта, за которой стоят деньги, а не дисциплина.", "id": "0.16.4.28"}, {"t": "Ссылки внутрь дашборда больше не ведут в 404", "k": "сделано", "n": "Снаружи дашборд живёт под /dashboard/, а nginx отдавал приложению путь уже без приставки — переход «разбор целиком» уводил мимо. Теперь nginx передаёт приставку заголовком, ссылки строятся от неё. Заодно для владельца заведена отдельная учётка входа.", "id": "0.16.4.29"}], "id": "0.16.4"}, {"t": "2026-09-16", "k": "план", "n": "43 записей", "c": [{"t": "Развёрнутый отчёт: что вышло из каждого разговора", "k": "сделано", "n": "Почему: «сколько звонков» — это про усердие, а мне нужно про результат. Заявка с ответственным и стадией — единственное, что показывает, дошёл ли разговор до дела.", "id": "0.16.5.0"}, {"t": "Пустая колонка и несобранная колонка — разные вещи", "k": "план", "n": "Почему: по этой таблице судят о работе людей — цена ошибки выше, чем в любом другом экране.", "id": "0.16.5.1"}, {"t": "Дашборд собирает данные сам, по расписанию", "k": "сделано", "n": "Почему: данные должны быть на экране без моего участия. Карточек за две недели около шести сотен, а проверка каждой — шесть обращений к CRM; разом это залп, которого Synergy не переживёт.", "id": "0.16.5.2"}, {"t": "Изучен Yandex SpeechSense как готовая замена", "k": "выяснено", "n": "Почему: вопрос «а может, взять готовое?» возвращается регулярно, и без записанных цифр на него отвечают по памяти.", "id": "0.16.5.3"}, {"t": "Щадящий режим к Synergy", "k": "сделано", "n": "Почему: 158 отказов 429 за день, из них 70 в одну минуту. Залп вебхуков поднимал два десятка задач, и они били CRM наперегонки — часть проверок типа звонка проходила вслепую.", "id": "0.16.5.4"}, {"t": "Очередь обработки терялась при перезапуске", "k": "выяснено", "n": "Почему: часть из них потеряна сегодня по моей вине: я перезапускал боевой сервис посреди рабочего дня, подбирая модель, и не подумал, что в очереди стоят живые звонки.", "id": "0.16.5.5"}, {"t": "Synergy ограничивает частоту запросов", "k": "выяснено", "n": "В момент залпа из 19 вебхуков из 84 обращений к Synergy 70 вернули 429. За день таких отказов 158. Из-за этого часть проверок типа звонка прошла вслепую.", "id": "0.16.5.6"}, {"t": "Догонялка: пропущенное возвращается само", "k": "сделано", "n": "Почему: теперь любой сбой или перезапуск самовосстанавливается за минуты, а не требует ручного вмешательства. Записи на диске — надёжная страховка: пока они целы, ничего не потеряно навсегда.", "id": "0.16.5.7"}, {"t": "Звонки с общих номеров распознаём моделью medium", "k": "решение", "n": "Почему: на сравнении одной записи small давала «директора так пришел и пришел», medium — «у директора подпиши и пришли». Точность важнее скорости, но не любой ценой: medium считает вдвое дольше записи, а сервер двухъядерный.", "id": "0.16.5.8"}, {"t": "Распознавание через OpenAI оказалось хуже локального", "k": "выяснено", "n": "Почему: я сравнил модели по формальному признаку — есть ли таймкоды — и не проверил результат на реальной записи. Вернул локальный движок в тот же день.", "id": "0.16.5.9"}, {"t": "Российский сервер — два ядра, не четыре", "k": "выяснено", "n": "Все прежние прикидки по нагрузке были вдвое оптимистичнее: я считал по амстердамскому серверу. Реальные замеры medium: запись 2,2 минуты — 4 минуты счёта, запись 14,5 минут — 27 минут. Плюс не было swap: тестовый процесс со второй копией модели убила нехватка памяти.", "id": "0.16.5.10"}, {"t": "Подстраховки: swap и откат на быструю модель", "k": "сделано", "n": "Добавлен файл подкачки 2 ГБ с swappiness=10 — как страховка, а не как основная память; переживает перезагрузку. Записи длиннее 8 минут распознаются small, запасная модель грузится лениво. 116 тестов проходят.", "id": "0.16.5.11"}, {"t": "Распознавание звонков с общих номеров — через OpenAI", "k": "решение", "n": "Почему: локальный whisper физически не тянет весь поток: 1443 минуты аудио в сутки — это порядка 60 часов счёта, а в сутках 24. На ограниченном потоке API стоит копейки и работает в десятки раз быстрее.", "id": "0.16.5.12"}, {"t": "Дешёвая модель распознавания не даёт таймкодов", "k": "выяснено", "n": "Почему: разница в цене 3 доллара против 6 в месяц, а разница в читаемости — между диалогом и двумя простынями текста.", "id": "0.16.5.13"}, {"t": "Распознавание переехало в Амстердам вслед за разбором", "k": "сделано", "n": "Российский сервер режет запись на дорожки и отдаёт их на /transcribe-track, Амстердам распознаёт через OpenAI и возвращает реплики с таймкодами. Проверено на настоящем разговоре: 1,1 минуты записи распознаны за 7,4 секунды, реплики чередуются корректно.", "id": "0.16.5.14"}, {"t": "Заявку заполняем только тремя полями", "k": "решение", "n": "Почему: автозаполнение остальных полей владелец отключил: разбор длинных разговоров даёт неточности — в двух проверенных записях по 18 тысяч символов тип техники не определился вовсе, а в одной заявке «наша цена» оказалась равна 1 рублю.", "id": "0.16.5.15"}, {"t": "17 заявок дозаполнены разбором", "k": "сделано", "n": "Почему: эти заявки остались от периода мёртвого прокси: расшифровка записывалась, а рекомендации — нет. Сначала прогнал одну и проверил, что соседние поля не затираются: Synergy сливает customs, а не заменяет.", "id": "0.16.5.16"}, {"t": "На карте можно задавать вопросы по каждому шагу", "k": "сделано", "n": "Почему: владелец просил возможность направлять работу точечно: замечание к конкретному шагу понятнее, чем общее пожелание в переписке, и не теряется между сеансами.", "id": "0.16.5.17"}, {"t": "Что должно происходить со звонком на общий номер", "k": "решение", "n": "Почему: звонки на общие номера компании — это входящий поток лидов, по каждому Synergy заводит заявку. Ручной разбор такого потока не масштабируется, а половина сказанного в разговоре в заявку не попадает вовсе.", "id": "0.16.5.18"}, {"t": "Фильтр «с рекламы» — не помеха, а отбор лидов", "k": "выяснено", "n": "Почему: сначала показалось, что фильтр мешает. На деле он выделяет ровно тот поток, ради которого всё затевалось. Менять его нужно осознанно, а не «чтобы заработало».", "id": "0.16.5.19"}, {"t": "Разбор падал из-за мёртвого прокси к OpenAI", "k": "выяснено", "n": "Замер с боевого сервера: OpenAI напрямую отдаёт 403 по географии, через настроенный прокси — таймаут на 30 секундах. Из-за этого 14 звонков из 15 за день оставались без разбора: расшифровка есть, а полей и отчётов нет. Та же причина губила и второй приёмник вебхуков.", "id": "0.16.5.20"}, {"t": "Разбор вынесен в Амстердам, телефония осталась в России", "k": "решение", "n": "Почему: OpenAI не обслуживает российские адреса, МегаФон не пускает зарубежные. Одному серверу не быть в обоих местах, поэтому каждый сервис стоит там, где его пускают. Прокси при этом не нужен — исчезает точка отказа.", "id": "0.16.5.21"}, {"t": "У Амстердама появился HTTPS", "k": "сделано", "n": "Почему: без домена сертификат не выпустить, а nip.io резолвит IP прямо из имени. Побочно снято ограничение, из-за которого на карте нельзя было печатать ничего чувствительного.", "id": "0.16.5.22"}, {"t": "На российском сервере выключен фаервол", "k": "открыто", "n": "ufw неактивен, порты 22, 80, 443 и 10050 открыты всему интернету. Там боевая телефония и 283 МБ записей разговоров. На амстердамском сервере ufw и fail2ban настроены.", "id": "0.16.5.23"}, {"t": "Второй приёмник вебхуков остановлен, подписка сохранена", "k": "сделано", "n": "megafon-webhook на порту 8765 за три дня не записал в Synergy ни одного комментария. Остановлен, автозапуск снят, на его адресе заглушка, отвечающая 200. Подписку в Synergy не трогали: она даёт поток {\"call_id\": N} по каждому звонку и пригодится дашборду.", "id": "0.16.5.24"}, {"t": "Интеграция с МегаФоном уже работает — на российском сервере", "k": "выяснено", "n": "Почему: геоблок МегаФона касался только амстердамской копии. «Обработано 0 звонков» было правдой лишь для неё — в России всё это время шла работа.", "id": "0.16.5.25"}, {"t": "Записи ВАТС действительно стерео, роли делятся верно", "k": "выяснено", "n": "На реальной расшифровке 21-минутного разговора: downmixed: false, две дорожки, оператор 3593 символа, клиент 13437. Вопрос, висевший с начала проекта, закрыт — разделение ролей работает.", "id": "0.16.5.26"}, {"t": "Продакшен не под git и разошёлся с рабочей копией", "k": "открыто", "n": "Почему: любая
