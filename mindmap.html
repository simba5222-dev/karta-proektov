 правка на боевом сервере сейчас невосстановима, а выкатить туда наш код нельзя — затрёт различия, о которых мы не знаем.", "id": "0.16.5.27"}, {"t": "Звонки уже лежат в Synergy — МегаФон для счётчиков не нужен", "k": "выяснено", "n": "Почему: это снимает главную зависимость проекта. Счётчики и дисциплина заполнения CRM строятся целиком на Synergy, которая доступна. Белый список ВАТС остаётся нужен только для скачивания самих записей — то есть для распознавания.", "id": "0.16.5.28"}, {"t": "Токен Synergy получен и проверен на живых данных", "k": "сделано", "n": "Первый настоящий замер: у Ткачевина на 16.09 — 47 исходящих при плане 120, из них 33 дольше 15 секунд, 33 минуты разговора, в среднем 59 секунд. Ссылки на записи есть у всех 47. Токен лежит в .env с правами 600, в git не попадает.", "id": "0.16.5.29"}, {"t": "Каркас дашборда готов и работает", "k": "сделано", "n": "Почему: это единственный этап, который не зависел от ключей и белого списка. Пока источников нет, база наполняется показательными данными — иначе невозможно понять, читаются ли экраны и те ли числа на них выведены.", "id": "0.16.5.30"}, {"t": "График по часам масштабировался по номеру часа", "k": "выяснено", "n": "В шаблоне map('list') на словаре даёт ключи, а не значения, поэтому столбики росли к вечеру независимо от данных. Заметил на скриншоте, исправил.", "id": "0.16.5.31"}, {"t": "Контроль прозвона выделен в отдельный проект", "k": "решение", "n": "Почему: это не часть ASR: тот распознаёт записи и ничего не знает про планы и дисциплину заполнения CRM. Общего кода почти нет, а жизненные циклы разные.", "id": "0.16.5.32"}, {"t": "Разбор каждого звонка не помещается в сутки", "k": "выяснено", "n": "Почему: распознавание идёт по одному звонку за раз и занимает все ядра. Варианты — порог по длительности, выборочный контроль, возврат base или отдельная машина; выбор за владельцем.", "id": "0.16.5.33"}, {"t": "Клиент ВАТС был написан под прошлое поколение API", "k": "выяснено", "n": "Почему: в проекте лежала спецификация прошлого поколения, а кабинет выдал адрес нового. Совпадение путей создавало ложное чувство, что протокол тот же.", "id": "0.16.5.34"}, {"t": "Клиент переписан под /crmapi/v1", "k": "сделано", "n": "Авторизация заголовком, GET /history/json вместо CSV-команды, POST /makecall, разбор трёх разных смыслов ответа 401. Добавлена выборка одного звонка по uid — вебхук уже сообщает идентификатор, тянуть весь период незачем. Вебхук rating теперь принимается. Проверочный скрипт переписан: идёт по шагам и говорит, что именно не так. Тестов 103, все проходят.", "id": "0.16.5.35"}, {"t": "На сервере появился браузер", "k": "сделано", "n": "Почему: нужен для сайтов, которые не берутся curl: контент рисуется яваскриптом либо требуется сессия. Venv отдельный, чтобы не трогать окружение работающего сервиса ASR.", "id": "0.16.5.36"}, {"t": "Браузер не обходит блокировку МегаФона", "k": "выяснено", "n": "Почему: блокировка сетевая, на стороне МегаФона, и инструментом её не обойти. Разрешить адрес 72.56.25.105 можно только вручную в веб-кабинете — в REST API такой команды нет, проверены все 603 строки спецификации.", "id": "0.16.5.37"}, {"t": "Переходим на модель small", "k": "решение", "n": "Почему: на продажных звонках важны названия техники и цены, переспросить клиента после разговора нельзя. Сравнения на реальной записи так и не было — записей нет, ВАТС недоступна; решение принято без замеров, и это разумно: small — рабочий выбор для русской телефонии. Цена — втрое больше процессорного времени, причём каждый звонок считается дважды.", "id": "0.16.5.38"}, {"t": "У ASR появился свой CLAUDE.md", "k": "сделано", "n": "Почему: полный /init продублировал бы README на 9 КБ и со временем разошёлся бы с ним. Ценность только в том, чего больше нигде нет.", "id": "0.16.5.39"}, {"t": "Артефакт на claude.ai подтянут к серверной карте", "k": "сделано", "n": "Почему: две карты с расходящимся содержанием хуже одной: непонятно, какой верить. Источник правды — репозиторий на сервере.", "id": "0.16.5.40"}, {"t": "Карта становится журналом работ", "k": "решение", "n": "На карте должно отражаться всё: общение, планы, выполненные работы, принятые решения. Не снимок состояния, а лента.", "id": "0.16.5.41"}, {"t": "Карта переведена на генератор", "k": "сделано", "n": "Почему: правка ленты в сорока килобайтах разметки руками — это гарантированные ошибки и дорогое обновление. Теперь дописывается одна запись в JSON.", "id": "0.16.5.42"}], "id": "0.16.5"}, {"t": "2026-09-15", "k": "план", "n": "13 записей", "c": [{"t": "Карта развёрнута на сервере", "k": "сделано", "n": "/var/www/karta/, раздаёт nginx по адресу /karta/. Закрыта basic-авторизацией, файл паролей /etc/nginx/.htpasswd-karta, индексация запрещена заголовком. Бэкап конфига nginx снят до правки, nginx -t прошёл до перезагрузки.", "id": "0.16.6.0"}, {"t": "Сертификат на этот сервер не выпустить", "k": "выяснено", "n": "Почему: Let's Encrypt проверяет владение доменом. Лечится поддоменом вроде karta.techno-res.ru, направленным сюда — certbot на сервере уже стоит.", "id": "0.16.6.1"}, {"t": "Карты делаем живой страницей, а не файлами XMind", "k": "решение", "n": "Почему: просьба была «видеть, как идёт процесс». Mind map показывает структуру, а не состояние. Сторонний MCP-сервер для XMind отклонён отдельно: чужой код на машине, где у агента sudo без пароля.", "id": "0.16.6.2"}, {"t": "Бот MAX ведём отдельным проектом", "k": "решение", "n": "Почему: решение владельца. Следствие для работы: схему базы бот наследует от механизации, а не определяет — иначе два проекта начнут тянуть таблицы в разные стороны.", "id": "0.16.6.3"}, {"t": "Пароль главного механика до сих пор дефолтный", "k": "открыто", "n": "Сайт при этом работает по открытому http. Дефолтный пароль плюс незашифрованный канал — самое уязвимое место из всего, что сейчас есть в трёх проектах.", "id": "0.16.6.4"}, {"t": "Замер скорости моделей на синтетике оказался непригодным", "k": "выяснено", "n": "Почему: основная работа Whisper приходится на декодирование слов. Нет слов — нет и нагрузки, цифры занижены в десятки раз.", "id": "0.16.6.5"}, {"t": "ВАТС не отвечает с этого сервера", "k": "выяснено", "n": "scripts/check_vats.py даёт таймаут, а не отказ авторизации: МегаФон фильтрует входящие по IP, адрес сервера нужно разрешить в кабинете. Из-за этого сравнить модели на настоящем звонке не удалось — записей нет вообще.", "id": "0.16.6.6"}, {"t": "Скачана модель small", "k": "сделано", "n": "464 МБ против 142 МБ у base. Настройки не менял: сервис остался на base.", "id": "0.16.6.7"}, {"t": "Какую модель оставить — base или small", "k": "открыто", "n": "Сервис работает на base, а в настройках проекта дефолт small. Нарочно так или случайно — не выяснено. Решать нужно на реальной записи: на продажных звонках важны названия техники и цены, но small втрое дороже по процессору, а каждый звонок считается дважды.", "id": "0.16.6.8"}, {"t": "Тесты ASR падают под пользователем agent", "k": "выяснено", "n": "Почему: иначе каждый новый сеанс принимает это за поломку и чинит несуществующий баг.", "id": "0.16.6.9"}, {"t": "Механизация поставлена под git", "k": "сделано", "n": "Два коммита, 36 файлов. config.php в .gitignore, рядом создан config.php.example с пустым паролем. Историю проверил поиском реального пароля — чисто. Обновлены CLAUDE.md проекта и глобальный.", "id": "0.16.6.10"}, {"t": "Механизация получает свой репозиторий, а не общий с ASR", "k": "решение", "n": "Почему: у проектов нет ни строчки общего кода и разные среды выкладки: Python-сервис под systemd против копирования файлов на shared-хостинг. Общий репозиторий тянул бы одно в другое. Плюс риск закоммитить config.php с реквизитами БД.", "id": "0.16.6.11"}, {"t": "Для ASR — короткий CLAUDE.md вместо полного init", "k": "решение", "n": "Почему: /init сгенерировал бы обзор кодовой базы, который уже есть в README на 9 КБ и написан лучше. Два документа с одним содержанием неизбежно разойдутся.", "id": "0.16.6.12"}], "id": "0.16.6"}], "id": "0.16"}], "id": "0"};
const PRESET_RELS = [];
const KINDS = {"сделано": "ok", "решение": "accent", "выяснено": "accent", "план": "wait", "вопрос": "warn", "риск": "stop", "перспектива": "wait", "открыто": "warn"};
const CSSVAR = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();

const NODE_W = 210, LINE_H = 16, PAD_Y = 9, GAP_Y = 10, LEVEL_W = 262;
const svg = document.getElementById('map');
const canvas = document.getElementById('canvas');
const gLinks = document.getElementById('links'), gRels = document.getElementById('rels'),
      gNodes = document.getElementById('nodes');
const panel = document.getElementById('panel');
const byId = {};

// Связи, дорисованные руками, живут в браузере: страница статическая, писать
// их некуда. Кнопка «связи в файл» отдаёт их, чтобы положить в mapdata.json —
// тогда они станут общими и переживут смену браузера.
let rels = PRESET_RELS.slice();
try { rels = rels.concat(JSON.parse(localStorage.getItem('karta-rels') || '[]')); } catch (e) {}

function index(n, depth = 0, parent = null){
  byId[n.id] = n; n.depth = depth; n.parent = parent;
  n.collapsed = depth >= 1 && (n.c || []).length > 0;
  n.lines = wrap(n.t);
  n.h = Math.max(30, n.lines.length * LINE_H + PAD_Y * 2);
  (n.c || []).forEach(c => index(c, depth + 1, n));
}
function wrap(text, max = 26){
  const words = (text || '').split(' '), out = []; let line = '';
  for (const w of words){
    if ((line + ' ' + w).trim().length > max && line){ out.push(line); line = w; }
    else line = (line + ' ' + w).trim();
    if (out.length === 3) break;
  }
  if (line && out.length < 3) out.push(line);
  if (out.length === 3 && words.join(' ').length > out.join(' ').length + 1) out[2] += '…';
  return out;
}
index(TREE);

// Раскладка: корень в центре, ветки расходятся вправо и влево — как в XMind.
// Высота поддерева считается снизу вверх, потом узлы расставляются сверху вниз.
function visibleKids(n){ return n.collapsed ? [] : (n.c || []); }
function measure(n){
  const kids = visibleKids(n);
  n.sub = kids.length ? kids.reduce((s, k) => s + measure(k), 0) + GAP_Y * (kids.length - 1)
                      : n.h;
  return n.sub;
}
function place(n, x, top, dir){
  n.x = x; n.dir = dir;
  const kids = visibleKids(n);
  n.y = top + n.sub / 2;
  let cy = top;
  for (const k of kids){ place(k, x + dir * LEVEL_W, cy, dir); cy += k.sub + GAP_Y; }
}
function layout(){
  const kids = visibleKids(TREE);
  // Балансируем: крупные ветки раскидываем по сторонам поочерёдно.
  const sizes = kids.map(k => { measure(k); return k.sub; });
  const order = kids.map((k, i) => i).sort((a, b) => sizes[b] - sizes[a]);
  const right = [], left = []; let rh = 0, lh = 0;
  for (const i of order){ if (rh <= lh){ right.push(kids[i]); rh += sizes[i]; }
                          else { left.push(kids[i]); lh += sizes[i]; } }
  right.sort((a, b) => kids.indexOf(a) - kids.indexOf(b));
  left.sort((a, b) => kids.indexOf(a) - kids.indexOf(b));
  const span = Math.max(rh, lh);
  let cy = -span / 2;
  for (const k of right){ place(k, LEVEL_W, cy, 1); cy += k.sub + GAP_Y; }
  cy = -span / 2;
  for (const k of left){ place(k, -LEVEL_W, cy, -1); cy += k.sub + GAP_Y; }
  TREE.x = 0; TREE.y = 0; TREE.dir = 1; TREE.sub = span;
}

function edge(a, b){
  const ax = a.x + (b.dir > 0 ? NODE_W / 2 : -NODE_W / 2), ay = a.y;
  const bx = b.x - b.dir * NODE_W / 2, by = b.y;
  const mx = (ax + bx) / 2;
  return `M${ax},${ay} C${mx},${ay} ${mx},${by} ${bx},${by}`;
}
function el(tag, attrs, parent){
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

let picking = false, picked = null;

function draw(){
  layout();
  gLinks.textContent = ''; gNodes.textContent = ''; gRels.textContent = '';
  const drawn = [];
  (function walk(n){
    drawn.push(n);
    for (const k of visibleKids(n)){ el('path', {class: 'link', d: edge(n, k)}, gLinks); walk(k); }
  })(TREE);

  for (const n of drawn){
    const g = el('g', {class: 'node', 'data-id': n.id,
                       transform: `translate(${n.x - NODE_W / 2},${n.y - n.h / 2})`}, gNodes);
    const color = CSSVAR(KINDS[n.k] || 'wait');
    el('rect', {x: 0, y: 0, width: NODE_W, height: n.h, rx: 5,
                fill: n.depth === 0 ? color : CSSVAR('surface'),
                stroke: color, 'stroke-width': n.depth <= 1 ? 2 : 1.4}, g);
    const t = el('text', {x: 11, y: PAD_Y + 12,
                          fill: n.depth === 0 ? '#fff' : CSSVAR('ink')}, g);
    n.lines.forEach((ln, i) => {
      const ts = el('tspan', {x: 11, dy: i ? LINE_H : 0}, t); ts.textContent = ln; });
    const kids = (n.c || []).length;
    if (kids){
      const badge = el('text', {class: 'cnt', x: NODE_W - 9, y: n.h - 8,
                                'text-anchor': 'end'}, g);
      badge.textContent = (n.collapsed ? '+' : '−') + kids;
    }
    if (picked === n.id) g.classList.add('picked');
    g.addEventListener('click', ev => { ev.stopPropagation(); onNode(n); });
    g.addEventListener('dblclick', ev => { ev.stopPropagation(); focus(n); });
    g.addEventListener('mouseenter', () => showPanel(n));
  }

  // Связи поверх дерева: пунктир со стрелкой между любыми двумя узлами.
  for (const r of rels){
    const a = byId[r.a], b = byId[r.b];
    if (!a || !b || a.x === undefined || b.x === undefined) continue;
    if (!drawn.includes(a) || !drawn.includes(b)) continue;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - 60;
    el('path', {class: 'rel', color: CSSVAR('accent'),
                d: `M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}`}, gRels);
    if (r.label){
      const lab = el('text', {class: 'rel-label', x: mx, y: my + 10,
                              'text-anchor': 'middle'}, gRels);
      lab.textContent = r.label;
    }
  }
  applyFilter();
}

function onNode(n){
  if (picking){
    if (!picked){ picked = n.id; draw(); return; }
    if (picked !== n.id){
      const label = prompt('Подпись связи (можно пусто):', '') || '';
      rels.push({a: picked, b: n.id, label});
      localStorage.setItem('karta-rels', JSON.stringify(
        rels.filter(r => !PRESET_RELS.includes(r))));
    }
    picked = null; picking = false;
    document.getElementById('link').classList.remove('on');
    svg.classList.remove('linking');
    draw(); return;
  }
  if ((n.c || []).length){ n.collapsed = !n.collapsed; draw(); remember(); }
}

function showPanel(n){
  panel.style.display = 'block';
  panel.innerHTML = '<span class="k">' + (KINDS[n.k] ? n.k : '') + '</span><b>' +
    esc(n.t) + '</b>' + (n.n ? '<p>' + esc(n.n) + '</p>' : '');
}
function esc(s){ return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// Масштаб и перетаскивание
let k = 0.8, tx = 0, ty = 0;
function apply(){ canvas.setAttribute('transform', `translate(${tx},${ty}) scale(${k})`); }
// Размер холста спрашиваем у всех, кто может ответить: в момент загрузки svg
// иногда ещё не имеет ширины, и карта вписывалась в триста пикселей.
function viewW(){ return Math.max(600, svg.getBoundingClientRect().width,
  document.documentElement.clientWidth || 0, window.innerWidth || 0); }
function viewH(){ return Math.max(400, svg.getBoundingClientRect().height,
  document.documentElement.clientHeight || 0, window.innerHeight || 0); }
function fit(){
  const box = canvas.getBBox();
  if (!box.width || !box.height) return;
  // Размер берём с запасом на случай, если холст ещё не получил высоту:
  // отрицательный масштаб один раз уже вывернул карту наизнанку.
  const W = viewW(), H = viewH();
  k = Math.max(0.15, Math.min((W - 90) / box.width, (H - 210) / box.height, 1.4));
  tx = W / 2 - (box.x + box.width / 2) * k;
  ty = (H + 120) / 2 - (box.y + box.height / 2) * k;
  apply();
}
function focus(n){
  const W = viewW(), H = viewH();
  k = 1.1; tx = W / 2 - n.x * k; ty = (H + 120) / 2 - n.y * k; apply();
}
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const nk = Math.min(3, Math.max(0.15, k * (e.deltaY < 0 ? 1.12 : 0.89)));
  tx = mx - (mx - tx) * nk / k; ty = my - (my - ty) * nk / k; k = nk; apply();
}, {passive: false});
let drag = null;
svg.addEventListener('mousedown', e => { drag = {x: e.clientX - tx, y: e.clientY - ty};
  svg.classList.add('grabbing'); });
window.addEventListener('mousemove', e => {
  if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); });
window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('grabbing'); });

// Кнопки
document.getElementById('fit').onclick = fit;
document.getElementById('zin').onclick = () => { k = Math.min(3, k * 1.2); apply(); };
document.getElementById('zout').onclick = () => { k = Math.max(0.15, k / 1.2); apply(); };
document.getElementById('expand').onclick = () => {
  (function all(n){ n.collapsed = false; (n.c || []).forEach(all); })(TREE);
  draw(); fit(); remember(); };
document.getElementById('collapse').onclick = () => {
  (function all(n){ if (n.depth >= 1) n.collapsed = (n.c || []).length > 0;
                    (n.c || []).forEach(all); })(TREE); draw(); fit(); remember(); };
document.getElementById('link').onclick = e => {
  picking = !picking; picked = null;
  e.target.classList.toggle('on', picking);
  svg.classList.toggle('linking', picking);
  if (picking) alert('Щёлкните по двум узлам — между ними появится связь.');
  draw();
};
document.getElementById('export').onclick = () => {
  const mine = JSON.parse(localStorage.getItem('karta-rels') || '[]');
  const blob = new Blob([JSON.stringify({"связи": mine}, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'связи.json'; a.click();
};

// Поиск: совпавшие узлы подсвечиваются, путь до них раскрывается.
const q = document.getElementById('q');
q.addEventListener('input', () => {
  const needle = q.value.trim().toLowerCase();
  if (needle){
    (function open(n){
      const hit = ((n.t || '') + ' ' + (n.n || '')).toLowerCase().includes(needle);
      let below = false;
      (n.c || []).forEach(c => { if (open(c)) below = true; });
      if (below) n.collapsed = false;
      n.hit = hit;
      return hit || below;
    })(TREE);
  } else {
    (function clear(n){ n.hit = false; (n.c || []).forEach(clear); })(TREE);
  }
  draw();
  if (needle) fit();
});

let hiddenKinds = [];
document.querySelectorAll('.lg').forEach(elem => {
  elem.onclick = () => {
    elem.classList.toggle('off');
    hiddenKinds = [...document.querySelectorAll('.lg.off')].map(x => x.dataset.kind);
    applyFilter();
  };
});
function applyFilter(){
  const needle = q.value.trim().toLowerCase();
  document.querySelectorAll('.node').forEach(g => {
    const n = byId[g.dataset.id];
    const hiddenKind = hiddenKinds.includes(n.k);
    const missed = needle && !n.hit;
    g.classList.toggle('dim', hiddenKind || missed);
  });
}

// Что было свёрнуто в прошлый раз — помним: карта большая, и каждый раз
// раскрывать одну и ту же ветку утомительно. Адрес с ?open=all открывает всё.
const OPEN_KEY = 'karta-open';
if (new URLSearchParams(location.search).get('open') === 'all'){
  (function all(n){ n.collapsed = false; (n.c || []).forEach(all); })(TREE);
} else {
  try {
    const saved = JSON.parse(localStorage.getItem(OPEN_KEY) || '[]');
    if (saved.length) (function apply(n){
      n.collapsed = (n.c || []).length > 0 && !saved.includes(n.id);
      (n.c || []).forEach(apply);
    })(TREE);
  } catch (e) {}
}
function remember(){
  const open = [];
  (function walk(n){ if (!n.collapsed && (n.c || []).length) open.push(n.id);
                     (n.c || []).forEach(walk); })(TREE);
  try { localStorage.setItem(OPEN_KEY, JSON.stringify(open)); } catch (e) {}
}

svg.addEventListener('click', () => { panel.style.display = 'none'; });
draw(); fit();
// Ещё раз, когда браузер закончил раскладку: первый расчёт бывает по нулевым
// размерам.
requestAnimationFrame(fit);
window.addEventListener('load', fit);
window.addEventListener('resize', fit);
</script></body></html>
