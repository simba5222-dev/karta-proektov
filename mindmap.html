<style>
:root{
  --bg:#eaeeef; --surface:#fff; --surface-2:#f4f7f8; --sunken:#e3e9ea;
  --ink:#14202a; --ink-2:#485965; --ink-3:#7b8d99;
  --line:#ccd6d9; --line-2:#b4c1c6;
  --accent:#0b5e6e; --accent-soft:#dcedf0;
  --ok:#3d6a41; --ok-soft:#e4efe3;
  --warn:#8f4d0e; --warn-soft:#faecd9;
  --stop:#8f2e2d; --stop-soft:#f8e3e1;
  --wait:#4c5a97; --wait-soft:#e2e6f5;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101820; --surface:#18232b; --surface-2:#141d24; --sunken:#0d151b;
  --ink:#e6eef1; --ink-2:#a8b9c3; --ink-3:#788a95;
  --line:#293640; --line-2:#3a4b55;
  --accent:#5ab6c6; --accent-soft:#112f37;
  --ok:#8bc28e; --ok-soft:#1a2a1d;
  --warn:#dfa35b; --warn-soft:#31240f;
  --stop:#e78a80; --stop-soft:#361d1b;
  --wait:#98a6e0; --wait-soft:#1b2036;
}}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--surface);
  border-bottom:1px solid var(--line);padding:12px 18px}
.top h1{margin:0 0 2px;font-size:20px;letter-spacing:-.01em}
.top .sub{font-size:12.5px;color:var(--ink-3)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
input[type=search]{flex:1 1 220px;min-width:180px;padding:7px 10px;font:inherit;
  border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2);color:var(--ink)}
button{padding:7px 11px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink);
  border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2)}
button:hover{background:var(--sunken)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12.5px;color:var(--ink-2)}
.lg{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg b{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600}
.lg.off{opacity:.35}
.lg.ok i{background:var(--ok)} .lg.accent i{background:var(--accent)}
.lg.warn i{background:var(--warn)} .lg.stop i{background:var(--stop)}
.lg.wait i{background:var(--wait)}
.wrap{padding:16px 18px 60px;max-width:1100px}
ul{list-style:none;margin:0;padding-left:20px}
ul.root{padding-left:0}
li{position:relative;margin:2px 0;padding-left:2px}
li:not(.root-item)::before{content:"";position:absolute;left:-12px;top:14px;width:10px;
  height:1px;background:var(--line-2)}
ul:not(.root)::before{content:"";position:absolute;left:8px;top:0;bottom:12px;width:1px;
  background:var(--line-2)}
ul:not(.root){position:relative}
.row{display:flex;align-items:flex-start;gap:7px;padding:4px 8px;border-radius:3px;
  background:var(--surface);border:1px solid transparent}
.row:hover{border-color:var(--line)}
.row.has-kids{cursor:pointer}
.tw{width:14px;flex:0 0 14px;color:var(--ink-3);font-size:11px;line-height:20px;text-align:center}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px}
.ttl{flex:1;min-width:0}
.ttl b{font-weight:600}
.note{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.count{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
li.collapsed > ul{display:none}
li.hidden{display:none}
mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:2px}
.dot.ok{background:var(--ok)} .dot.accent{background:var(--accent)}
.dot.warn{background:var(--warn)} .dot.stop{background:var(--stop)}
.dot.wait{background:var(--wait)}
.row.lvl1{background:var(--surface-2);border-color:var(--line)}
.row.lvl1 .ttl b{font-size:16px}
.foot{margin-top:28px;font-size:12.5px;color:var(--ink-3)}
.foot a{color:var(--accent)}
</style></head><body>

щую группу", "k": "план", "n": "Смысл всей затеи: слесарь не заходит на сайт и не будет, а мессенджер у него уже открыт."}, {"t": "Как сообщение доходит до нас — развилка", "k": "риск"}, {"t": "Опознать, кто написал", "k": "план", "n": "Участник группы сопоставляется с сотрудником через users.max_user_id. Поле в базе уже зарезервировано — заполнить его для слесарей предстоит руками."}, {"t": "Записать отметку в базу механизации", "k": "план", "n": "Строка в daily_reports с source = 'max_bot'. Значение в схеме тоже заранее предусмотрено — бот встаёт на подготовленное место, рядом с self и mechanic."}, {"t": "Механик видит отметку в табеле", "k": "план", "n": "Дальше ничего нового не нужно: табель и отчёты уже умеют показывать отметки, им неважно, кто их поставил."}]}, {"t": "Уже понятно", "k": "сделано", "c": [{"t": "Зачем нужен: слесари не логинятся принципиально", "k": "сделано"}, {"t": "Точки стыковки в базе зарезервированы заранее", "k": "сделано"}, {"t": "Развилка по доставке известна, оба пути описаны", "k": "сделано"}]}, {"t": "Осталось", "k": "вопрос", "c": [{"t": "Определить границы проекта", "k": "вопрос", "n": "только механизация или ещё отдел продаж — от этого зависит, где боту жить"}, {"t": "Выбрать путь доставки", "k": "вопрос", "n": "дождаться HTTPS либо сознательно взять опрос по крону"}, {"t": "Разобраться с API мессенджера MAX", "k": "вопрос", "n": "вебхуки, лимиты, опознание участников группы"}, {"t": "Заполнить users.max_user_id для слесарей", "k": "вопрос"}, {"t": "Создать репозиторий и каркас", "k": "вопрос"}]}]}, {"t": "Дашборд прозвона", "k": "сделано", "n": "Контроль тёплого прозвона", "c": [{"t": "Алгоритм: как считается день менеджера", "k": "план", "c": [{"t": "Забираем звонки из Synergy", "k": "сделано", "n": "Сущность telephony-calls: направление, длительность, время, ссылка на запись. Кто звонил — в самом звонке, поле custom-28722 вида «Фамилия Имя Отчество 726». ВАТС для этого не нужна."}, {"t": "Считаем количество и отделяем дозвоны", "k": "сделано"}, {"t": "Находим клиента в Synergy по номеру", "k": "сделано", "n": "Телефон — единственный надёжный ключ между системами. Код поиска контакта уже написан в сервисе ASR, переиспользуем."}, {"t": "Проверяем, что менеджер заполнил карточку", "k": "сделано", "n": "Четыре пункта: потребность в технике, объекты, ИНН компании, поставленная задача. Заполнением считается правка в течение 30 минут после звонка. Частота заказов считается отдельно — по числу заявок и сделок клиента."}, {"t": "Разбираем сам разговор", "k": "сделано", "n": "Запись тянет российский сервер — МегаФон не отдаёт записи зарубежным адресам. Распознаёт местный faster-whisper, деля стерео на менеджера и клиента. Расшифровка вместе с карточкой уходит в модель, та возвращает: о чём говорили, что прозвучало и не попало в CRM, каких обязательных вопросов по учебнику менеджер не задал и что не предложил в дополнение."}, {"t": "Показываем на дашборде", "k": "сделано", "n": "Готово: экраны «сегодня», «менеджер» и «звонок» на http://72.56.25.105/dashboard/, доступ по паролю. Пока показывают показательные данные — источники не подключены."}, {"t": "Разворачиваем итог: что вышло из разговора", "k": "сделано", "n": "Отдельная таблица /report, строка на каждый разговор: кому звонил, что добавил в карточку, какая потребность у клиента дословно, заведена ли компания, сколько заявок создал, кого назначили ответственным и чем заявки кончились. Заявка считается заведённой по звонку, если создана в течение 24 часов после него."}, {"t": "Проваливаемся в заявку: почему не дошла до сделки", "k": "сделано", "n": "Заявку заводит прозвон, а ведёт её другой человек. Его звонки собираются отдельно — по телефонам клиента за период от создания заявки, — распознаются и разбираются. Вердикт: что произошло, позиция клиента, что ответственный сделал и чего не сделал, можно ли вернуть. Если история не пролистана до даты заявки, вердикт не выносится: «мы не смотрели» и «менеджер не звонил» — разные вещи."}, {"t": "Ловим заявки, о которых менеджер не сказал", "k": "сделано", "n": "Все входящие отдела продаж: по контакту проверяется, появилась ли заявка после звонка. Если нет — распознаётся первая минута записи, и модель отвечает, был ли запрос на технику. Стороны в расшифровке обезличены: кто из них наш менеджер, разбор решает по содержанию — по номеру канала это определить нельзя. Заявка бывает только если технику просит позвонивший. По подтверждённым находкам заводится заявка «Пойманная с прослушки» с выжимкой, расшифровкой и цитатой из записи. Менеджеру даётся три часа, чтобы оформить заявку самому."}]}, {"t": "Уже решено", "k": "сделано", "c": [{"t": "Работает на настоящих данных: 951 звонок за 10 дней, обновляется сам каждые 10 минут", "k": "сделано"}, {"t": "Звонки берутся из Synergy, ВАТС не нужна: автор звонка записан в самом звонке", "k": "сделано"}, {"t": "Проверка карточек: потребность, объекты, ИНН, поставленная задача", "k": "сделано"}, {"t": "Задачи видны названием и сроком, а не галочкой: 45 разговоров с задачей за две недели", "k": "сделано"}, {"t": "Частота заказов считается по заявкам и сделкам клиента, а не со слов менеджера", "k": "сделано"}, {"t": "Развёрнутый отчёт /report: фильтр в шапке каждой колонки, период «с — по», причина проигрыша заявки прямо в строке", "k": "сделано"}, {"t": "Разбор разговоров: что упущено в CRM — с цитатой из записи, каких вопросов по учебнику не задали", "k": "сделано"}, {"t": "Заявки /orders: исход, ответственный и вердикт «почему не дошла до сделки»", "k": "сделано"}, {"t": "Доступ по паролю, ссылки работают под приставкой /dashboard/", "k": "сделано"}, {"t": "Пойманные заявки: 16.09 из 107 входящих отдела продаж 95 без заявки, найдено 24 запроса, заведено 19 заявок", "k": "сделано"}, {"t": "Точность просева считается по отметкам людей: 17.09 — 18 верных заявок из 26, лишние закрыты", "k": "сделано"}]}, {"t": "Осталось", "k": "вопрос", "c": [{"t": "Свои учётные записи вместо общего пароля", "k": "вопрос", "n": "дашборд показывает работу конкретных людей; чтобы дать доступ РОПу, нужен отдельный вход"}, {"t": "Уточнить план по менеджеру", "k": "вопрос", "n": "сейчас 120 звонков в день для всех; у разных людей он может быть разным"}, {"t": "Показывать расшифровки звонков прозвона", "k": "вопрос", "n": "сейчас распознаются только звонки с общих номеров; для прозвона решение не принято"}]}]}, {"t": "Связка CRM и 1С: зарплата и техника", "k": "план", "n": "Новый проект, заведён 18.09.2026. Кода нет: ждём доступа к 1С и решения по полям в CRM.", "c": [{"t": "Кто за что отвечает", "k": "решение", "c": [{"t": "CRM — сделка и решения РОПа", "k": "план", "n": "ИНН заказчика и исполнителя, объект, техника, часы, ставки. Процент менеджера и доли между менеджерами."}, {"t": "1С — деньги", "k": "план", "n": "Реализация, документы исполнителя, НДС и НП, факт и дата оплаты, дебиторка."}, {"t": "Наш сервис — расчёт", "k": "план", "n": "Дельта, проценты, переносы по оплате, удержание 30% по ДЗ, ведомость и остаток к выдаче."}]}, {"t": "Как считается зарплата", "k": "выяснено", "n": "Разобрано по файлу менеджера: 69 листов, история с 2020 года.", "c": [{"t": "Дельта = (заказчик − НДС − НП) − (исполнитель − НДС − НП) − расходы/1,22", "k": "выяснено"}, {"t": "ЗП по сделке = дельта × процент менеджера", "k": "выяснено"}, {"t": "В месяц входят только оплаченные сделки", "k": "выяснено", "n": "Август 2026: вся дельта 639 066, без задолженности 378 262, с переносами 492 607."}, {"t": "Удержание 30% по дебиторке старше трёх месяцев", "k": "выяснено"}, {"t": "Остаток к выдаче — долг компании перед сотрудником", "k": "риск", "n": "У Сибирякова на конец августа 325 100. Накапливается из месяца в месяц."}]}, {"t": "Узкое место: процент и доли назначает РОП", "k": "риск", "n": "Формулы нет — это решение человека. Сегодня живёт в голове РОПа и в ячейке Excel. Пока у него нет места в данных, расчёт не собрать целиком.", "c": [{"t": "Предложено: поля в заявке CRM", "k": "вопрос", "n": "Процент, «делится с», доля. Заполняет РОП при согласовании. Ответа владельца пока нет."}]}, {"t": "Порядок работ", "k": "план", "c": [{"t": "0. Доступ и опись данных", "k": "вопрос", "n": "Письмо администратору готово. Первым делом опись, а не код."}, {"t": "1. Сверка августа до копейки", "k": "план", "n": "Пока не сходится — дальше не идём."}, {"t": "2. Поля решений РОПа в CRM", "k": "план"}, {"t": "3. Связка документов реквизитом «Заявка CRM»", "k": "план", "n": "Расширением. Типовую конфигурацию не трогаем."}, {"t": "4. Автоматический расчёт месяца", "k": "план"}, {"t": "5. Месяц-два параллельно с Excel", "k": "план", "n": "Переходим, когда три месяца подряд сойдутся."}, {"t": "6. Учёт техники в УАТ", "k": "перспектива"}]}, {"t": "Чего не делаем", "k": "решение", "c": [{"t": "Не переносим расчёт внутрь 1С", "k": "решение", "n": "Правила ещё будут меняться, а каждая правка там — работа программиста и риск для боевой базы."}, {"t": "Не правим типовую конфигурацию", "k": "решение"}, {"t": "Не читаем напрямую из SQL", "k": "решение", "n": "Таблицы 1С называются _Document137 и меняются при обновлении."}, {"t": "Не отменяем Excel сразу", "k": "решение", "n": "Он остаётся эталоном для сверки."}]}]}, {"t": "Хозяйство: серверы и деньги", "k": "план", "c": [{"t": "Амстердам — разработка, модель, дашборд", "k": "сделано", "n": "72.56.25.105. Файрвол, вход по ключу, fail2ban, резервные копии в Россию."}, {"t": "Петербург — боевая телефония", "k": "сделано", "n": "91.220.109.49. Принимает вебхуки ВАТС, скачивает записи, распознаёт. Закрыт 17.09 после 5700 попыток подбора пароля за сутки."}, {"t": "Расход на модель", "k": "выяснено", "n": "Разбор разговора $0,0086, просев входящего $0,0064. При 300 исходящих и 50 звонках на общие номера — $91 в месяц; со всем потоком около $175."}, {"t": "Остаток на счёте виден на странице качества", "k": "сделано", "n": "18.09 деньги кончились посреди дня, и конвейер встал молча. Теперь остаток считается и краснеет за неделю до конца."}, {"t": "384 пропущенных звонка в сутки", "k": "риск", "n": "Больше половины входящих остаются без ответа. Этой дырой никто не занимается."}]}, {"t": "Журнал работ", "k": "план", "n": "Что решали и почему — по дням", "c": [{"t": "2026-09-18", "k": "план", "n": "27 записей", "c": [{"t": "Заявку заводим сразу, проверяем постфактум", "k": "решение", "n": "Почему: За три часа заказчик успевает найти технику в другом месте. Лишняя строка в CRM стоит минуты работы, потерянный заказчик — сделки."}, {"t": "От трубки до заявки — минута вместо семи часов", "k": "сделано", "n": "Замер по вчерашним данным: от конца разговора до просева проходило 6,8 часа в среднем, худший случай — 30 часов. Убрано трёхчасовое ожидание, записи и просев переведены с часа на минуту. Живой звонок сегодня прошёл весь путь — от «положил трубку» до вердикта — за 25 секунд."}, {"t": "Звонки берём из ВАТС, а не из CRM; привязка по номерам", "k": "сделано", "n": "Почему: CRM отдавала данные с задержкой и с дырами: у 42 звонков за 17.09 стояла нулевая длительность, хотя разговор шёл по три-шесть минут."}, {"t": "Наши числа сошлись с ВАТС: 224 входящих на отдел продаж", "k": "выяснено", "n": "Владелец увидел в кабинете 224 входящих за 17.09, у нас значилось 264 и 735. Сверка через сам ВАТС: за сутки 735 входящих всего — ровно столько же, сколько у нас. Из них на номера отдела продаж — 224, это и есть цифра владельца. Отвеченных 351, пропущенных 384, дольше 40 секунд — 238."}, {"t": "Половина просева шла по склеенной расшифровке", "k": "выяснено", "n": "У 84 из 146 просеянных звонков стороны в расшифровке не были разделены — их считали до починки разделения дорожек. Роли в таком тексте определить невозможно в принципе. На разделённых расшифровках точность просева 92%, на склеенных — 82%. Записи пересчитаны заново, находки пересеяны."}, {"t": "Точность просева доведена с 63% до 92%", "k": "сделано", "n": "Заведён проверочный набор: 84 разговора с известным ответом, размеченных по полным расшифровкам. Написана мерялка — прогоняет просев по набору и считает точность и полноту, разбивая ошибки по видам. Каждая правка запроса теперь проверяется цифрой, а не на ощупь. Итог дня: точность 92,3%, полнота 96,0% — цель в 90% взята. Главная правка — научить машину отличать заказчика от исполнителя: на этой путанице она давала три четверти лишних заявок. Цифра и история замеров — на странице «качество просев"}, {"t": "Куда уходил бюджет OpenAI", "k": "выяснено", "n": "За 17.09 обработано не 184 звонка, а около 850 обращений к модели: 458 из них — ночная догонялка хвоста за прошлые дни, 146 просев, 171 разбор заявок с общих номеров. Обычные сутки стоят $2,5–3, то есть около $80 в месяц; вчерашний всплеск дали разовые догонялки и пробы. Поставлен свой учёт: каждый ответ модели записывается с числом токенов и ценой, в утреннем отчёте появился раздел «Расход на модель». Сравнение моделей на наборе: дешёвая gpt-4o-mini теряет 6 настоящих заявок из 25 — экономия в"}, {"t": "Выжимка появилась и у заявок с общих номеров", "k": "сделано", "n": "Поле «выжимка» завели 17.09, и заполнял его только дашборд у заявок «Пойманная с прослушки». У заявок, которые CRM заводит по звонку с рекламы, поле оставалось пустым, хотя разбор по ним есть. Исправлено на боевом сервере, 25 прошлых заявок дозаполнены."}, {"t": "Механизмы сессии поставлены в ASR и карту", "k": "сделано", "n": "Кит из чужой методики, разобранный вчера, поставлен в оставшиеся два проекта. В ASR главный сторож — запрет закончить работу, если код правили, а сервис не перезапускали: без рестарта проверяется старый код. В карте — запрет править собранную страницу руками и запрет закончить с невыложенной картой. По дороге в ките нашлась дыра: проверка синтаксиса пропускала файлы с русскими именами, потому что git их экранирует."}, {"t": "Подсказка менеджеру во всплывающей карточке звонка", "k": "открыто", "n": "Идея владельца: новичку в момент звонка показывать, с кем он говорит и что спрашивать. Карточку CRM показывает сама, но в ней только то, что завели руками. Подсказка собрана и проверена на живых клиентах: о чём говорили в прошлый раз, история заявок и сделок, названные цены, чек-лист вопросов по этой технике из учебника компании. Отложено по решению владельца. Чтобы включить, нужно завести в CRM текстовое поле у контакта и сказать его номер: через API поле не создать, Synergy требует категорию,"}, {"t": "384 пропущенных звонка за сутки", "k": "открыто", "n": "Больше половины входящих вчера остались без ответа. Это другая дыра, не та, которую мы закрываем: заказчик, который не дозвонился, потерян так же надёжно, как тот, о ком менеджер не завёл заявку. Стоит посмотреть отдельно — кто не берёт трубку и в какие часы."}, {"t": "Отбор звонков — по номерам менеджеров, а не по именам", "k": "решение", "n": "Почему: Решение владельца. Имена и учётки в ВАТС не соответствуют людям, номера — единственное устойчивое."}, {"t": "Владелец прослушал 39 заявок и разметил ошибки", "k": "выяснено", "n": "Из тридцати девяти заявок, заведённых машиной, 29 переведены в «сделка провалена»: 12 с пометкой «дубль ИИ», 9 — «ошибка ИИ», 8 без пометки (настоящие проигранные сделки). Дубли. Во всех случаях заявка менеджера была создана в момент звонка: он заводит карточку, пока телефон звонит, и её метка времени оказывается на минуту-две раньше начала разговора у нас. Проверка «появилась ли заявка после звонка» этого не видела. Ошибки. Все девять одного рода: техника была не у нас. Либо исполнитель откликн"}, {"t": "Главный признак заявки: у кого техника", "k": "решение", "n": "Почему: Девять ошибок из девяти, помеченных владельцем, объяснялись именно этим."}, {"t": "Дубли проверяем только после принятого звонка", "k": "решение", "n": "Почему: Слова владельца: «создавая такую заявку мы упрощаем работу менеджеру». Лишняя строка в CRM дешевле потерянного заказчика."}, {"t": "Критерии отбора записаны, ошибки возвращаются в набор сами", "k": "сделано", "n": "Появился живой документ с правилами: какие звонки берём, что делаем по шагам, когда заявку заводим и когда нет — с примерами из наших же разговоров. Рядом механизм обучения: владелец помечает заявку в CRM, скрипт находит исходный звонок и кладёт его в проверочный набор с правильным ответом. Пометка владельца важнее моей разметки. Точность на его разметке: 95,8% при полноте 92% против 63% утром."}, {"t": "Перезвон исполнителя не отличить по словам — только по истории звонков", "k": "выяснено", "n": "Владелец спросил, почему заведена заявка в 15:01. Разговор на 45 секунд: «экскаватор-погрузчик нужен на завтра, планировочный ковш, район станции МЭК» — названа техника, навесное, объект и сроки. Обе ступени просева сказали «заказчик», и по тексту иначе решить было нельзя. Правда оказалась в истории: Толстов звонил на этот номер четыре раза в 14:49–14:51, не дозвонился, и человек перезвонил в 14:59. Менеджер искал технику — исполнитель откликнулся. Правило: два и более коротких недозвона с нашей"}, {"t": "Время звонка хранилось в двух видах, и правило молча не работало", "k": "выяснено", "n": "Почему: Механизм без проверки на живых данных выглядит работающим ровно до первого настоящего случая."}, {"t": "Посреди дня кончились деньги на OpenAI", "k": "выяснено", "n": "Конвейер встал молча: двенадцать входящих подряд остались без просева, пять падений за час. Я сперва принял отказ за лимит по скорости и полчаса чинил выдержку темпа — настоящая причина была в ответе: «You have no credits remaining». Ничего не потеряно: звонки и записи лежат у нас, пакетный просев догоняет хвост сам. По дороге закрыта дыра — два звонка из ВАТС не имели строки проверки по CRM, и пакетный просев их бы не увидел. Теперь строка заводится сразу, до распознавания."}, {"t": "Счётчик остатка денег на модель", "k": "сделано", "n": "Почему: Деньги кончились посреди рабочего дня, и узнали мы об этом только по упавшему конвейеру."}, {"t": "Сколько стоит разбор: цифры для планирования", "k": "выяснено", "n": "По собственному учёту, а не на глаз: разбор одного разговора — $0,0086, просев входящего — $0,0064, вторая ступень — $0,0028. При 300 исходящих и 50 звонках на общие номера в день выходит $3 в день, $91 в месяц; с запасом на длинные разговоры — $120. Плюс поиск потерянных заявок во входящих (264 звонка) ещё $82 в месяц. Всё вместе — около $175 в месяц. Распознавание сейчас местное и бесплатное; перевод прозвона на whisper-1 добавил бы $162 в месяц. Решение владельца: оставляем как есть."}, {"t": "Итоговый замер дня: точность 95,8%, полнота 92%", "k": "выяснено", "n": "Чистый прогон по 90 разговорам с известными ответами, без сбоев. Из 24 заявок, которые машина завела бы, верны 23; из 25 настоящих запросов поймано 23. Четыре звонка отсеяны по истории звонков, без обращения к модели — это перезвоны исполнителей на наш поиск. И точнее, и бесплатно. Осталось три ошибки, и две из них — одна болезнь: первая ступень путается в ролях. Она пытается решить два вопроса разом — «просил ли кто-то технику» и «кто есть кто». Следующий шаг: снять с неё второй вопрос совсем и"}, {"t": "Связка с 1С — отдельный проект", "k": "решение", "n": "Почему: Звонки — конвейер, который крутится сам. Здесь работа с правилами, где ошибка попадает в зарплату живого человека: другой темп и другая цена ошибки."}, {"t": "Как на самом деле считается зарплата менеджера", "k": "выяснено", "n": "Разобран файл, который менеджер заполняет и присылает на проверку: 69 листов, история с 2020 года, шесть мегабайт. По сделке: дельта = (сумма заказчику − НДС − НП) − (сумма исполнителю − НДС − НП) − прочие расходы / 1,22, умножить на долю менеджера, если сделку делят. ЗП по сделке = дельта × процент менеджера. По месяцу: в дельту входят только оплаченные сделки, неоплаченные переезжают в месяц оплаты. Август 2026: вся дельта 639 066, без задолженности 378 262, с переносами 492 607. Сверху оклад,"}, {"t": "Процент и доли назначает РОП — значит им нужно место в данных", "k": "решение", "n": "Почему: Иначе файл всё равно придётся дозаполнять руками, и ошибки останутся там же, где сейчас."}, {"t": "Расчёт зарплаты не уходит внутрь 1С", "k": "решение", "n": "Почему: Правила ещё будут меняться: сегодня оклад есть, завтра его нет. Каждая правка внутри 1С — работа программиста, снятие конфигурации с поддержки и риск для боевой базы. В коде правку видно и можно проверить на прошлых месяцах."}, {"t": "Сначала сверка, потом переход", "k": "решение", "n": "Почему: Ошибка здесь попадает не в лог, а в зарплату живого человека. Excel остаётся эталоном, пока машина не докажет, что считает так же."}]}, {"t": "2026-09-17", "k": "план", "n": "30 записей", "c": [{"t": "Боевой сервер закрыт", "k": "сделано", "n": "Почему: 5700 попыток подбора пароля за сутки при открытом порте 22, записях разговоров и токенах на борту."}, {"t": "Резервное копирование: два сервера страхуют друг друга", "k": "сделано", "n": "Почему: Разбор оплачен запросами к модели, записи из телефонии живут ограниченное время. Потеря диска означала потерю работы, которую нельзя повторить."}, {"t": "Постоянная связь с маком владельца", "k": "сделано", "n": "Почему: Владелец просил постоянную связь и возможность передавать файлы, не настраивая туннель каждый раз."}, {"t": "Мак подвисает не от старости, а от нехватки памяти", "k": "выяснено", "n": "Почему: Владелец жаловался на сильные подвисания и спрашивал, не мак ли узкое место. Оказалось — он, но не мощностью процессора, а объёмом памяти."}, {"t": "День остался без разбора: упал на блокировке базы", "k": "выяснено", "n": "Почему: Три дыры дали один результат: работа целого дня пропала, и заметил это владелец, а не мы."}, {"t": "Распознавание ускорено вдвое: дорожки считаются одновременно", "k": "сделано", "n": "Почему: Клиент шлёт записи по одной, поэтому параллельность заданий не давала ничего — простаивала половина машины."}, {"t": "Утренний контур: диагностика в 6:00 и отчёт в 7:00", "k": "сделано", "n": "Почему: Механизм без сторожа — это намерение: падение разбора пролежало незамеченным одиннадцать часов."}, {"t": "Проба распознавания через API: быстрее в пять раз, но границы фраз даёт только whisper-1", "k": "выяснено", "n": "Почему: Разбор опирается на чередование реплик. Модель без границ фраз бесполезна, какой бы точной ни была."}, {"t": "Боевой сервер открыт всему интернету", "k": "открыто", "n": "Почему: Амстердамский сервер закрыт по всем этим пунктам после 19 тысяч попыток за двое суток. Боевой остался как был."}, {"t": "Резервных копий нет ни у базы, ни у записей", "k": "открыто", "n": "Почему: Разбор оплачен запросами к модели, а записи из ВАТС доступны ограниченное время: потеря диска означает потерю работы, которую нельзя повторить."}, {"t": "Карта проектов теперь собирается и в XMind", "k": "сделано", "n": "Почему: Владельцу удобнее смотреть дерево, а не страницу. Две карты из одного источника не разойдутся."}, {"t": "Сервер видит папки мака, а в дашборде заведены механизмы-сторожа", "k": "сделано", "n": "Почему: Правило в тексте работает первые полчаса сессии; дальше держит только механизм."}, {"t": "Роли сторон в записи нельзя определять по каналу", "k": "выяснено", "n": "Почему: без этого невозможно отличить «клиент просит технику» от «наш менеджер ищет её у подрядчика» — а это разница между заявкой и мусором в CRM."}, {"t": "Боевой разбор звонков с рекламы роли не путает", "k": "выяснено", "n": "Почему: если бы боевой разбор путал стороны, все отчёты по рекламным звонкам за месяцы были бы недостоверны. Проверить стоило прежде, чем чинить."}, {"t": "Заявку по пойманному звонку подтверждает человек", "k": "решение", "n": "Почему: точность просева 69% — каждая третья заявка мусорная. Автомат при такой точности засоряет CRM быстрее, чем приносит пользу. Вернём, когда дойдёт до 90%: отметки «запроса не было» и подтверждения копятся, считать будет по чему."}, {"t": "Ловим заявки, о которых менеджер не сказал", "k": "решение", "n": "Почему: входящие на общие номера мы слышим, а прямые звонки менеджеру — слепая зона. Заявка попадает в CRM только если менеджер сразу переводит её в сделку; нет времени или желания — и заказ исчезает."}, {"t": "Слепая зона — 107 разговоров в день", "k": "выяснено", "n": "Почему: без этой цифры нельзя было выбрать схему: разбирать весь поток целиком — 12,5 часов записи в сутки, это сервер круглосуточно."}, {"t": "Двухступенчатый просев вместо сплошного разбора", "k": "сделано", "n": "Почему: запрос звучит в начале разговора, и на черновом тексте его видно. Сплошной разбор стоил бы в десять раз дороже и не помещался бы в сутки."}, {"t": "Заявка «Пойманная с прослушки» заводится сама", "k": "сделано", "n": "Почему: семь из первых восьми запросов были «на завтра» — суточный цикл бесполезен, заявка нужна в тот же час."}, {"t": "Три грабли Synergy при записи заявки", "k": "выяснено", "n": "Почему: каждая из трёх молча давала неверный результат: заявка доставалась тому же менеджеру, который её и потерял."}, {"t": "Разобраны все 14 заявок: четыре потеряны без единого звонка", "k": "выяснено", "n": "Почему: «заявка провалена» в CRM не объясняет ничего. Разбор показывает, что половина потерь — не отказ клиента, а несделанный звонок."}, {"t": "Отчёт менеджера: фильтры в шапке, период «с — по», причина проигрыша в строке", "k": "сделано", "n": "Почему: владелец смотрит таблицу целиком: ради одной фразы проваливаться в каждую заявку он не должен, а отдельная карточка фильтров занимала полэкрана."}, {"t": "Колонка «задача» врала по всем 570 разговорам", "k": "выяснено", "n": "Почему: цифра «ноль задач» — это обвинение человека в безделье. Один необработанный код ответа превратил рабочий инструмент в клевету."}, {"t": "Заявки: проваливание и вердикт «почему не дошла до сделки»", "k": "сделано", "n": "Почему: заявку заводит прозвон, а ведёт её другой человек, и его звонки дашборд вообще не собирал. Без них «почему не купили» оставалось догадкой."}, {"t": "Листание истории обрывалось, и вердикты получались ложными", "k": "выяснено", "n": "Почему: «мы не смотрели» и «менеджер не звонил» — разные вещи. Перепутав их, отчёт из инструмента превращается в источник несправедливых решений."}, {"t": "Разбираем разговоры от 40 секунд", "k": "решение", "n": "Почему: считать всё подряд — почти восемь часов процессора; в разговорах короче сорока секунд содержания почти нет."}, {"t": "Разбор звонков прозвона поставлен на конвейер", "k": "сделано", "n": "Почему: по этим строкам судят о работе людей. Ложное обвинение здесь дороже пропущенного пункта."}, {"t": "Учебник компании встроен в разбор разговоров", "k": "сделано", "n": "Почему: без учебника модель писала «уточнить потребность» там, где по стандарту компании надо было спросить вес груза, вылет стрелы и ширину проезда."}, {"t": "Восемь разговоров с названной потребностью и без заявки", "k": "выяснено", "n": "Почему: это единственная строка отчёта, за которой стоят деньги, а не дисциплина."}, {"t": "Ссылки внутрь дашборда больше не ведут в 404", "k": "сделано", "n": "Снаружи дашборд живёт под /dashboard/, а nginx отдавал приложению путь уже без приставки — переход «разбор целиком» уводил мимо. Теперь nginx передаёт приставку заголовком, ссылки строятся от неё. Заодно для владельца заведена отдельная учётка входа."}]}, {"t": "2026-09-16", "k": "план", "n": "43 записей", "c": [{"t": "Развёрнутый отчёт: что вышло из каждого разговора", "k": "сделано", "n": "Почему: «сколько звонков» — это про усердие, а мне нужно про результат. Заявка с ответственным и стадией — единственное, что показывает, дошёл ли разговор до дела."}, {"t": "Пустая колонка и несобранная колонка — разные вещи", "k": "план", "n": "Почему: по этой таблице судят о работе людей — цена ошибки выше, чем в любом другом экране."}, {"t": "Дашборд собирает данные сам, по расписанию", "k": "сделано", "n": "Почему: данные должны быть на экране без моего участия. Карточек за две недели около шести сотен, а проверка каждой — шесть обращений к CRM; разом это залп, которого Synergy не переживёт."}, {"t": "Изучен Yandex SpeechSense как готовая замена", "k": "выяснено", "n": "Почему: вопрос «а может, взять готовое?» возвращается регулярно, и без записанных цифр на него отвечают по памяти."}, {"t": "Щадящий режим к Synergy", "k": "сделано", "n": "Почему: 158 отказов 429 за день, из них 70 в одну минуту. Залп вебхуков поднимал два десятка задач, и они били CRM наперегонки — часть проверок типа звонка проходила вслепую."}, {"t": "Очередь обработки терялась при перезапуске", "k": "выяснено", "n": "Почему: часть из них потеряна сегодня по моей вине: я перезапускал боевой сервис посреди рабочего дня, подбирая модель, и не подумал, что в очереди стоят живые звонки."}, {"t": "Synergy ограничивает частоту запросов", "k": "выяснено", "n": "В момент залпа из 19 вебхуков из 84 обращений к Synergy 70 вернули 429. За день таких отказов 158. Из-за этого часть проверок типа звонка прошла вслепую."}, {"t": "Догонялка: пропущенное возвращается само", "k": "сделано", "n": "Почему: теперь любой сбой или перезапуск самовосстанавливается за минуты, а не требует ручного вмешательства. Записи на диске — надёжная страховка: пока они целы, ничего не потеряно навсегда."}, {"t": "Звонки с общих номеров распознаём моделью medium", "k": "решение", "n": "Почему: на сравнении одной записи small давала «директора так пришел и пришел», medium — «у директора подпиши и пришли». Точность важнее скорости, но не любой ценой: medium считает вдвое дольше записи, а сервер двухъядерный."}, {"t": "Распознавание через OpenAI оказалось хуже локального", "k": "выяснено", "n": "Почему: я сравнил модели по формальному признаку — есть ли таймкоды — и не проверил результат на реальной записи. Вернул локальный движок в тот же день."}, {"t": "Российский сервер — два ядра, не четыре", "k": "выяснено", "n": "Все прежние прикидки по нагрузке были вдвое оптимистичнее: я считал по амстердамскому серверу. Реальные замеры medium: запись 2,2 минуты — 4 минуты счёта, запись 14,5 минут — 27 минут. Плюс не было swap: тестовый процесс со второй копией модели убила нехватка памяти."}, {"t": "Подстраховки: swap и откат на быструю модель", "k": "сделано", "n": "Добавлен файл подкачки 2 ГБ с swappiness=10 — как страховка, а не как основная память; переживает перезагрузку. Записи длиннее 8 минут распознаются small, запасная модель грузится лениво. 116 тестов проходят."}, {"t": "Распознавание звонков с общих номеров — через OpenAI", "k": "решение", "n": "Почему: локальный whisper физически не тянет весь поток: 1443 минуты аудио в сутки — это порядка 60 часов счёта, а в сутках 24. На ограниченном потоке API стоит копейки и работает в десятки раз быстрее."}, {"t": "Дешёвая модель распознавания не даёт таймкодов", "k": "выяснено", "n": "Почему: разница в цене 3 доллара против 6 в месяц, а разница в читаемости — между диалогом и двумя простынями текста."}, {"t": "Распознавание переехало в Амстердам вслед за разбором", "k": "сделано", "n": "Российский сервер режет запись на дорожки и отдаёт их на /transcribe-track, Амстердам распознаёт через OpenAI и возвращает реплики с таймкодами. Проверено на настоящем разговоре: 1,1 минуты записи распознаны за 7,4 секунды, реплики чередуются корректно."}, {"t": "Заявку заполняем только тремя полями", "k": "решение", "n": "Почему: автозаполнение остальных полей владелец отключил: разбор длинных разговоров даёт неточности — в двух проверенных записях по 18 тысяч символов тип техники не определился вовсе, а в одной заявке «наша цена» оказалась равна 1 рублю."}, {"t": "17 заявок дозаполнены разбором", "k": "сделано", "n": "Почему: эти заявки остались от периода мёртвого прокси: расшифровка записывалась, а рекомендации — нет. Сначала прогнал одну и проверил, что соседние поля не затираются: Synergy сливает customs, а не заменяет."}, {"t": "На карте можно задавать вопросы по каждому шагу", "k": "сделано", "n": "Почему: владелец просил возможность направлять работу точечно: замечание к конкретному шагу понятнее, чем общее пожелание в переписке, и не теряется между сеансами."}, {"t": "Что должно происходить со звонком на общий номер", "k": "решение", "n": "Почему: звонки на общие номера компании — это входящий поток лидов, по каждому Synergy заводит заявку. Ручной разбор такого потока не масштабируется, а половина сказанного в разговоре в заявку не попадает вовсе."}, {"t": "Фильтр «с рекламы» — не помеха, а отбор лидов", "k": "выяснено", "n": "Почему: сначала показалось, что фильтр мешает. На деле он выделяет ровно тот поток, ради которого всё затевалось. Менять его нужно осознанно, а не «чтобы заработало»."}, {"t": "Разбор падал из-за мёртвого прокси к OpenAI", "k": "выяснено", "n": "Замер с боевого сервера: OpenAI напрямую отдаёт 403 по географии, через настроенный прокси — таймаут на 30 секундах. Из-за этого 14 звонков из 15 за день оставались без разбора: расшифровка есть, а полей и отчётов нет. Та же причина губила и второй приёмник вебхуков."}, {"t": "Разбор вынесен в Амстердам, телефония осталась в России", "k": "решение", "n": "Почему: OpenAI не обслуживает российские адреса, МегаФон не пускает зарубежные. Одному серверу не быть в обоих местах, поэтому каждый сервис стоит там, где его пускают. Прокси при этом не нужен — исчезает точка отказа."}, {"t": "У Амстердама появился HTTPS", "k": "сделано", "n": "Почему: без домена сертификат не выпустить, а nip.io резолвит IP прямо из имени. Побочно снято ограничение, из-за которого на карте нельзя было печатать ничего чувствительного."}, {"t": "На российском сервере выключен фаервол", "k": "открыто", "n": "ufw неактивен, порты 22, 80, 443 и 10050 открыты всему интернету. Там боевая телефония и 283 МБ записей разговоров. На амстердамском сервере ufw и fail2ban настроены."}, {"t": "Второй приёмник вебхуков остановлен, подписка сохранена", "k": "сделано", "n": "megafon-webhook на порту 8765 за три дня не записал в Synergy ни одного комментария. Остановлен, автозапуск снят, на его адресе заглушка, отвечающая 200. Подписку в Synergy не трогали: она даёт поток {\"call_id\": N} по каждому звонку и пригодится дашборду."}, {"t": "Интеграция с МегаФоном уже работает — на российском сервере", "k": "выяснено", "n": "Почему: геоблок МегаФона ка const KINDS = {"сделано": "ok", "решение": "accent", "выяснено": "accent", "план": "wait", "вопрос": "warn", "риск": "stop", "перспектива": "wait", "открыто": "warn"};
const tree = document.getElementById('tree');

function render(n, level){
  const li = document.createElement('li');
  if (level === 0) li.className = 'root-item';
  const kids = n.c || [];
  const row = document.createElement('div');
  row.className = 'row' + (kids.length ? ' has-kids' : '') + (level === 1 ? ' lvl1' : '');
  row.innerHTML =
    '<span class="tw">' + (kids.length ? '▾' : '') + '</span>' +
    '<span class="dot ' + (KINDS[n.k] || 'wait') + '"></span>' +
    '<span class="ttl"><b>' + esc(n.t) + '</b>' +
    (kids.length ? ' <span class="count">' + kids.length + '</span>' : '') +
    (n.n ? '<span class="note">' + esc(n.n) + '</span>' : '') + '</span>';
  li.appendChild(row);
  if (kids.length){
    const ul = document.createElement('ul');
    kids.forEach(k => ul.appendChild(render(k, level + 1)));
    li.appendChild(ul);
    // По умолчанию открыты только направления: первый экран должен давать
    // обзор, а не простыню. Глубже разворачивается по клику или поиском.
    if (level >= 1) li.classList.add('collapsed');
    row.addEventListener('click', e => {
      e.stopPropagation();
      li.classList.toggle('collapsed');
      row.querySelector('.tw').textContent = li.classList.contains('collapsed') ? '▸' : '▾';
    });
    if (li.classList.contains('collapsed')) row.querySelector('.tw').textContent = '▸';
  }
  li.dataset.kind = n.k || '';
  li.dataset.text = ((n.t || '') + ' ' + (n.n || '')).toLowerCase();
  return li;
}
function esc(s){ return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }

(DATA.c || []).forEach(n => tree.appendChild(render(n, 0)));

document.getElementById('all').onclick = () => {
  document.querySelectorAll('li.collapsed').forEach(li => {
    li.classList.remove('collapsed');
    const tw = li.querySelector('.tw'); if (tw) tw.textContent = '▾';
  });
};
document.getElementById('none').onclick = () => {
  document.querySelectorAll('#tree li').forEach(li => {
    if (!li.querySelector('ul')) return;
    const deep = li.parentElement.closest('li');
    if (deep) {
      li.classList.add('collapsed');
      const tw = li.querySelector('.tw'); if (tw) tw.textContent = '▸';
    }
  });
};

// Поиск: показываем совпавшие узлы вместе с их родителями и раскрываем путь.
const q = document.getElementById('q');
q.addEventListener('input', () => {
  const needle = q.value.trim().toLowerCase();
  const all = document.querySelectorAll('#tree li');
  if (!needle){
    all.forEach(li => { li.classList.remove('hidden'); li.querySelectorAll('mark').forEach(unmark); });
    return;
  }
  all.forEach(li => li.classList.add('hidden'));
  all.forEach(li => {
    if (!li.dataset.text.includes(needle)) return;
    li.classList.remove('hidden');
    let p = li.parentElement.closest('li');
    while (p){ p.classList.remove('hidden', 'collapsed');
      const tw = p.querySelector('.tw'); if (tw && p.querySelector('ul')) tw.textContent = '▾';
      p = p.parentElement.closest('li'); }
    li.querySelectorAll(':scope > .row ul').forEach(() => {});
  });
});
function unmark(m){ m.replaceWith(m.textContent); }

// Легенда работает как фильтр: клик прячет узлы этого вида.
document.querySelectorAll('.lg').forEach(el => {
  el.onclick = () => {
    el.classList.toggle('off');
    const hidden = [...document.querySelectorAll('.lg.off')].map(x => x.dataset.kind);
    document.querySelectorAll('#tree li').forEach(li => {
      li.style.display = hidden.includes(li.dataset.kind) ? 'none' : '';
    });
  };
});
